/* ── 주차별 추이 그래프 (매출 · DAU · PU · ARPPU) ── */
function shortPeriod(s){
  s=String(s||'').trim();
  // "Tue Jul 07 2026 00:00:00 GMT+0900" 같은 Date 문자열도 "7/7"로 정리
  if(/[A-Za-z]{3}/.test(s)&&/\d{4}/.test(s)){
    var d=new Date(s);
    if(!isNaN(d.getTime())) return (d.getMonth()+1)+'/'+d.getDate();
  }
  var m=s.match(/(\d{1,2})[\/\.\-](\d{1,2})(?!\d)/);   // "7/6~7/12" → "7/6"
  if(m) return Number(m[1])+'/'+Number(m[2]);
  return s.length>9?s.slice(0,9):s;
}
// "7/14" 같은 주차 라벨을 시간순 정렬용 숫자로 (연말연초 보정 포함)
function weekKeyOf(lbl){
  var m=String(lbl).match(/^(\d{1,2})\/(\d{1,2})$/);
  if(!m) return 0;
  var now=new Date(),t=new Date(now.getFullYear(),+m[1]-1,+m[2]).getTime();
  if(t-now.getTime()>180*86400000) t=new Date(now.getFullYear()-1,+m[1]-1,+m[2]).getTime();
  return t;
}
var TREND_REGIONS=[
  {key:'kr',label:'한국',  color:'#ef4444'},
  {key:'tw',label:'대만',  color:'#3b82f6'},
  {key:'jp',label:'일본',  color:'#10b981'},
  {key:'gl',label:'글로벌',color:'#8b5cf6'}
];
// 라벨의 소속 "주(월요일 기준)"를 키로 반환 → 같은 주의 여러 스냅샷을 하나로 묶는 데 사용
function weekMondayKey(lbl){
  var t=weekKeyOf(lbl); if(!t) return String(lbl);
  var d=new Date(t),day=(d.getDay()+6)%7; // 월=0
  d.setDate(d.getDate()-day);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
// 며칠 간격으로 들어온 포인트들을 "주 단위"로 접는다.
// 한 주 안에서는 가장 이른 날짜(= 그 주 시작 = 실제 주간 지표 행)의 값만 남긴다.
function collapseToWeekly(arr){
  var buckets={};
  (arr||[]).forEach(function(t){
    var lbl=shortPeriod(t.period), tk=weekKeyOf(lbl), key=weekMondayKey(lbl);
    var cur=buckets[key];
    if(!cur||tk<cur._tk){
      var copy={}; for(var p in t) if(t.hasOwnProperty(p)) copy[p]=t[p];
      copy.period=lbl; copy._tk=tk;
      buckets[key]=copy;
    }
  });
  return Object.keys(buckets).map(function(k){return buckets[k];})
    .sort(function(a,b){return a._tk-b._tk;});
}

// 여러 권역 시계열을 한 좌표계에 겹쳐 그린다. values 안의 null은 선을 끊지 않고 건너뛴다.
function multiTrendSvg(seriesList,labels,fmt){
  var W=560,H=215,PL=54,PR=14,PT=14,PB=26;
  var all=[];
  seriesList.forEach(function(s){s.values.forEach(function(v){if(v!==null&&isFinite(v))all.push(v);});});
  if(!all.length) return '';
  var max=Math.max.apply(null,all),min=Math.min.apply(null,all);
  if(max===min){max=max*1.1||1;min=Math.max(0,min*0.9);}
  var pad=(max-min)*0.12;
  var yMax=max+pad,yMin=Math.max(0,min-pad),yR=(yMax-yMin)||1;
  var n=labels.length;
  function X(i){return PL+(W-PL-PR)*(n===1?0.5:i/(n-1));}
  function Y(v){return PT+(H-PT-PB)*(1-(v-yMin)/yR);}

  var grid='',TICKS=4;
  for(var g=0;g<=TICKS;g++){
    var gv=yMin+(yR*g/TICKS),gy=Y(gv);
    grid+='<line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'" stroke="#eef2f7" stroke-width="1"/>'
        +'<text x="'+(PL-8)+'" y="'+(gy+3.2).toFixed(1)+'" font-size="9" fill="#9ca3af" text-anchor="end">'+esc(fmt(gv))+'</text>';
  }

  var paths=seriesList.map(function(s){
    var pts=[],dots='';
    s.values.forEach(function(v,i){
      if(v===null||!isFinite(v))return;
      pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1));
      dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.6" fill="#fff" stroke="'+s.color+'" stroke-width="1.8">'
           +'<title>'+esc(s.label+' · '+labels[i]+' · '+fmt(v))+'</title></circle>';
    });
    if(!pts.length)return'';
    return '<path d="M'+pts.join(' L')+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+dots;
  }).join('');

  var step=Math.max(1,Math.ceil(n/6)),xl='';
  for(var i2=0;i2<n;i2+=step){
    xl+='<text x="'+X(i2).toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="#9ca3af" text-anchor="'+(i2===0?'start':'middle')+'">'+esc(labels[i2])+'</text>';
  }
  if((n-1)%step!==0)
    xl+='<text x="'+X(n-1).toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="#9ca3af" text-anchor="end">'+esc(labels[n-1])+'</text>';

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+grid+paths+xl+'</svg>';
}

function renderTrendCharts(){
  var byR=window._trendByRegionCache;
  var hasRegion=byR&&['kr','tw','jp'].some(function(k){return (byR[k]||[]).length>0;});
  // 권역 데이터가 아직 없으면 글로벌 단일 추이로 대체 표시
  if(!hasRegion){
    var tr=window._trendCache||[];
    if(!tr.length) return '';
    byR={gl:tr};
  }
  // 며칠 간격 스냅샷을 주 단위로 접어 일별처럼 보이는 문제를 해결
  var byRWeekly={};
  TREND_REGIONS.forEach(function(r){ if(byR[r.key]) byRWeekly[r.key]=collapseToWeekly(byR[r.key]); });
  byR=byRWeekly;

  // x축 = 전 권역에 등장하는 주차의 합집합(중복 제거 후 시간순). 권역마다 빠진 주차는 null로 둔다.
  var labelSet={};
  TREND_REGIONS.forEach(function(r){
    (byR[r.key]||[]).forEach(function(t){var l=shortPeriod(t.period);if(l)labelSet[l]=1;});
  });
  var labels=Object.keys(labelSet).sort(function(a,b){return weekKeyOf(a)-weekKeyOf(b);});
  // 최근 한 달(약 5주)치만 보여준다 — 오래된 스냅샷 라벨이 섞여 그래프가 짧아 보이는 것 방지
  var cutoff=Date.now()-35*86400000;
  var recent=labels.filter(function(l){var t=weekKeyOf(l);return t&&t>=cutoff;});
  if(recent.length>=2) labels=recent;
  if(labels.length<2) return '';

  var metrics=[
    {key:'revenue',label:'주간 매출'},
    {key:'dau',    label:'일평균 DAU'},
    {key:'pu',     label:'일평균 PU'},
    {key:'arppu',  label:'ARPPU'}
  ];

  var cards=metrics.map(function(m){
    var seriesList=[],legend='';
    TREND_REGIONS.forEach(function(r){
      var arr=byR[r.key]||[];
      if(!arr.length) return;
      var map={};   // 같은 주차가 여러 번 오면 마지막 값이 이김
      arr.forEach(function(t){var v=Number(t[m.key]);map[shortPeriod(t.period)]=(v>0?v:null);});
      var vals=labels.map(function(l){return map.hasOwnProperty(l)?map[l]:null;});
      if(!vals.some(function(v){return v!==null;})) return;
      seriesList.push({label:r.label,color:r.color,values:vals});
      var lastV=null,lastI=-1;
      for(var i=vals.length-1;i>=0;i--){if(vals[i]!==null){lastV=vals[i];lastI=i;break;}}
      legend+='<span class="inline-flex items-center gap-1 text-[10px] font-bold" style="color:'+r.color+'">'
        +'<span style="width:8px;height:8px;border-radius:2px;background:'+r.color+';display:inline-block"></span>'+r.label
        +(lastV!==null?' <span class="text-gray-500">'+fmtNum(lastV)+'</span><span class="text-gray-300 font-normal">('+esc(labels[lastI])+')</span>':'')+'</span>';
    });
    if(!seriesList.length) return '';
    var svg=multiTrendSvg(seriesList,labels,fmtNum);
    if(!svg) return '';
    return '<div class="card"><div class="flex items-center justify-between mb-2 flex-wrap gap-y-1">'
      +'<span class="text-xs font-bold text-gray-700">'+m.label+'</span>'
      +'<div class="flex items-center gap-2.5 flex-wrap">'+legend+'</div>'
      +'</div>'+svg+'</div>';
  }).join('');

  if(!cards) return '';
  var note=hasRegion
    ?'최근 '+labels.length+'주 · 점에 마우스를 올리면 값 표시'
    :'글로벌만 표시 중 — 권역별 데이터는 KPI API 재배포 후 쌓입니다';
  return '<div class="card-header" style="padding:0;margin:18px 0 12px"><span class="card-title"><i class="ti ti-chart-line text-indigo-500"></i> 주차별 추이 <span class="text-[11px] text-gray-400 font-medium ml-1">'+(hasRegion?'권역별':'글로벌')+'</span></span><span class="text-[11px] '+(hasRegion?'text-gray-400':'text-amber-600')+' font-medium">'+note+'</span></div>'
    +'<div class="grid grid-cols-1 md:grid-cols-2 gap-4">'+cards+'</div>';
}

// 권역별 월간 누적매출 추이 (시트에는 당월 누적만 있어 서버가 월별로 축적한 값을 쓴다)
function renderMonthlyCharts(){
  var byR=window._monthTrendCache;
  if(!byR) return '';
  var labelSet={};
  TREND_REGIONS.forEach(function(r){ (byR[r.key]||[]).forEach(function(t){ if(t.period) labelSet[t.period]=1; }); });
  var labels=Object.keys(labelSet).sort();
  if(labels.length<2) {
    // 아직 한 달치뿐이면 그래프 대신 안내만
    if(!labels.length) return '';
    return '<div class="card-header" style="padding:0;margin:18px 0 12px"><span class="card-title"><i class="ti ti-calendar-dollar text-amber-500"></i> 월별 누적매출 추이</span></div>'
      +'<div class="card"><p class="text-[12px] text-gray-400 text-center py-6">'+esc(labels[0])+' 데이터만 쌓여 있습니다. 매달 한 점씩 누적되어 다음 달부터 그래프가 그려져요.</p></div>';
  }
  var seriesList=[],legend='';
  // 이번 달은 아직 진행 중(월 누적)이므로 축 라벨에 표시해 오해를 막는다
  var curKey=(new Date()).getFullYear()+'-'+String((new Date()).getMonth()+1).padStart(2,'0');
  var xLabels=labels.map(function(l){
    return l.replace(/^\d{4}-/,'')+'월'+(l===curKey?'*':'');
  });

  // 한국은 규모가 10배 이상 커서 같이 그리면 나머지가 바닥에 깔린다 → 카드를 분리한다
  function chartFor(keys,title){
    var series=[],lg='';
    TREND_REGIONS.forEach(function(r){
      if(keys.indexOf(r.key)===-1) return;
      var arr=byR[r.key]||[]; if(!arr.length) return;
      var map={}; arr.forEach(function(t){ var v=Number(t.revenue); map[t.period]=(v>0?v:null); });
      var vals=labels.map(function(l){ return map.hasOwnProperty(l)?map[l]:null; });
      if(!vals.some(function(v){return v!==null;})) return;
      series.push({label:r.label,color:r.color,values:vals});
      var lastV=null,lastI=-1; for(var i=vals.length-1;i>=0;i--){ if(vals[i]!==null){lastV=vals[i];lastI=i;break;} }
      lg+='<span class="inline-flex items-center gap-1 text-[10px] font-bold" style="color:'+r.color+'">'
        +'<span style="width:8px;height:8px;border-radius:2px;background:'+r.color+';display:inline-block"></span>'+r.label
        +(lastV!==null?' <span class="text-gray-500">'+fmtNum(lastV)+'</span><span class="text-gray-300 font-normal">('+esc(xLabels[lastI])+')</span>':'')+'</span>';
    });
    if(!series.length) return '';
    var s=multiTrendSvg(series,xLabels,fmtNum);
    if(!s) return '';
    return '<div class="card"><div class="flex items-center justify-between gap-2 flex-wrap mb-2">'
      +'<span class="text-xs font-bold text-gray-700">'+title+'</span>'
      +'<div class="flex items-center gap-2.5 flex-wrap">'+lg+'</div></div>'+s+'</div>';
  }

  var cards=chartFor(['kr'],'🇰🇷 한국')+chartFor(['tw','jp','gl'],'🇹🇼 대만 · 🇯🇵 일본 · 🌐 글로벌');
  if(!cards) return '';
  return '<div class="card-header" style="padding:0;margin:18px 0 12px"><span class="card-title"><i class="ti ti-calendar-dollar text-amber-500"></i> 월별 매출 추이 <span class="text-[11px] text-gray-400 font-medium ml-1">권역별 · '+(new Date().getFullYear())+'년</span></span>'
    +'<span class="text-[11px] text-gray-400 font-medium">'+labels.length+'개월 · 실제 매출 기준 · *표시된 이번 달은 진행 중(누적)</span></div>'
    +'<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">'+cards+'</div>';
}

// 일별 차트 툴팁: 커서를 올린 날의 모든 값을 한 번에 보여준다
function dgTip(ev,payload){
  var box=document.getElementById('dg-tip'); if(!box) return;
  var d; try{ d=JSON.parse(decodeURIComponent(payload)); }catch(e){ return; }
  // 반올림된 축약값(2.6만)이 아니라 정확한 숫자를 보여준다 — 날짜별 차이가 드러나야 하므로
  function exact(v){ return Math.round(Number(v)||0).toLocaleString('ko-KR'); }
  function row(lb,v,color,abbr){
    var txt=abbr?(fmtNum(v)+' <span style="color:#6b7280">('+exact(v)+')</span>'):exact(v);
    return '<div><span style="display:inline-block;width:60px;color:#9ca3af">'+lb+'</span>'
      +'<b style="color:'+(color||'#fff')+'">'+txt+'</b></div>';
  }
  var html='<div style="font-weight:700;margin-bottom:3px">'+esc(d.d)+'</div>'
    +row('누적매출',d.cum,'#c4b5fd',true)
    +(d.target?row('목표누적',d.target,'#e5e7eb',true):'')
    +(d.prev?row('전월누적',d.prev,'#ddd6fe',true):'')
    +(d.ly?row('전년누적',d.ly,'#e5e7eb',true):'')
    +'<div style="height:5px"></div>'
    +row('당일매출',d.rev,'#c4b5fd',true)
    +row('DAU',d.dau,'#93c5fd')+row('PU',d.pu,'#5eead4')+row('ARPPU',d.arppu,'#fcd34d');
  box.innerHTML=html;
  box.style.display='block';
  // 차트 안에서 커서 위치를 따라가되, 오른쪽 끝에서는 왼쪽으로 뒤집는다
  var wrap=box.parentNode, r=wrap.getBoundingClientRect();
  var x=ev.clientX-r.left+14, y=ev.clientY-r.top+12;
  if(x+180>r.width) x=ev.clientX-r.left-180;
  box.style.left=Math.max(4,x)+'px';
  box.style.top=Math.max(4,y)+'px';
}
function dgTipHide(){ var b=document.getElementById('dg-tip'); if(b) b.style.display='none'; }

// 글로벌 일별 추이: 매출은 "누적" 선그래프(실적 vs 목표), PU·ARPPU·DAU는 일별 값 선.
// 목표매출은 요일 패턴·메이저 업데이트 가중치를 반영한 곡선을 누적해 월말까지 이어그린다.
function renderDailyGlobal(){
  var days=window._dailyGlobalCache||[];
  if(days.length<2) return '';
  var W=980,H=300,PL=64,PR=16,PT=18,PB=34;
  var n=days.length;
  // x축은 "오늘까지"가 아니라 이번 달 마지막 날까지 미리 펼쳐두고, 선은 실제 값이 있는 날짜까지만 그린다.
  var totalSlots=window._dailyTargetDays||n;
  var targetPerDay=window._dailyTargetPerDay||0;
  // 요일 패턴(목요일 점검 등)·메이저 업데이트 가중치가 반영된 일별 목표 곡선.
  // 아직 백엔드가 곡선을 안 주면(구버전) 평균치로 평평하게 채워 하위호환한다.
  var targetCurve=(window._dailyTargetCurve&&window._dailyTargetCurve.length===totalSlots)
    ? window._dailyTargetCurve
    : (targetPerDay?Array(totalSlots).fill(targetPerDay):null);
  var revs=days.map(function(d){return Number(d.revenue)||0;});

  function cumulate(arr){ var s=0; return (arr||[]).map(function(v){ s+=(Number(v)||0); return s; }); }
  var cumThis=cumulate(revs);                          // n개(오늘까지) — 실선
  var cumTarget=targetCurve?cumulate(targetCurve):null; // totalSlots개(월말까지) — 점선

  // 비교군: 전월 동기(옅은 보라) · 작년 동월(회색) — 같은 "일자"끼리 맞춰 오늘까지만 누적한다
  function dayMap(arr){ var m={}; (arr||[]).forEach(function(d){ m[+String(d.date).slice(8,10)]=Number(d.revenue)||0; }); return m; }
  var prevMap=dayMap(window._dailyPrevCache), lyMap=dayMap(window._dailyLastYearCache);
  function overlaps(m){ return days.some(function(d){ return m[+String(d.date).slice(8,10)]>0; }); }
  var hasPrev=overlaps(prevMap), hasLY=overlaps(lyMap);
  function cumMap(map,count){ var s=0,out=[]; for(var i=1;i<=count;i++){ s+=(map[i]||0); out.push(s); } return out; }
  var cumPrev=hasPrev?cumMap(prevMap,n):null;
  var cumLY=hasLY?cumMap(lyMap,n):null;

  var maxRev=Math.max.apply(null,cumThis.concat(cumTarget||[]).concat(cumPrev||[]).concat(cumLY||[]))||1;
  var plotH=H-PT-PB, plotW=W-PL-PR;
  var slot=plotW/totalSlots;
  function cx(i){return PL+slot*(i+0.5);}
  function byRev(v){return PT+plotH*(1-v/(maxRev*1.15));}

  // 매출 축(왼쪽) 눈금 — maxRev가 최종 확정된 뒤에 그려야 목표선·비교군까지 스케일에 맞는다
  var grid='';
  for(var g=0;g<=4;g++){
    var gv=maxRev*1.15*g/4, gy=PT+plotH*(1-g/4);
    grid+='<line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'" stroke="#eef2f7"/>'
      +'<text x="'+(PL-8)+'" y="'+(gy+3.2).toFixed(1)+'" font-size="9" fill="#9ca3af" text-anchor="end">'+esc(fmtNum(gv))+'</text>';
  }

  // 메이저 업데이트 날짜 — 배경에 옅은 세로 가이드로 표시해 그 날 이후 누적선이 얼마나 꺾였는지 대조한다
  var majorDays=(window._glMajorUpdateDays||[]).filter(function(d){return d>=1&&d<=totalSlots;});
  var majorMarkers=majorDays.map(function(d){
    var x=cx(d-1).toFixed(1);
    return '<line x1="'+x+'" y1="'+PT+'" x2="'+x+'" y2="'+(PT+plotH)+'" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 3" opacity=".55"/>'
      +'<circle cx="'+x+'" cy="'+(PT-3)+'" r="2.6" fill="#f59e0b"><title>'+d+'일 메이저 업데이트</title></circle>';
  }).join('');

  function linePath(vals){ return vals.map(function(v,i){return (i===0?'M':'L')+cx(i).toFixed(1)+' '+byRev(v).toFixed(1);}).join(' '); }
  function dotsFor(vals,color,r,label){
    return vals.map(function(v,i){
      return '<circle cx="'+cx(i).toFixed(1)+'" cy="'+byRev(v).toFixed(1)+'" r="'+r+'" fill="'+color+'"><title>'+(i+1)+'일 '+label+' 누적 '+fmtNum(v)+'</title></circle>';
    }).join('');
  }
  function lgChip(color,label,val){
    return '<span class="inline-flex items-center gap-1 text-[10px] font-bold" style="color:'+color+'">'
      +'<span style="width:8px;height:8px;border-radius:2px;background:'+color+';display:inline-block"></span>'+label
      +(val?' <span class="text-gray-500">'+val+'</span>':'')+'</span>';
  }

  // 누적 매출: 작년 동월 → 전월 동기 → 목표(점선, 월말까지) → 이번 달 실적(진하게, 맨 위) 순으로 그린다
  var revLines='';
  if(cumLY) revLines+='<path d="'+linePath(cumLY)+'" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="2 3" opacity=".7"/>'+dotsFor(cumLY,'#9ca3af',2,'작년 동월');
  if(cumPrev) revLines+='<path d="'+linePath(cumPrev)+'" fill="none" stroke="#c4b5fd" stroke-width="1.8" opacity=".85"/>'+dotsFor(cumPrev,'#c4b5fd',2,'전월 동기');
  var targetLine='';
  if(cumTarget){
    var tDots=cumTarget.map(function(v,i){
      var isMajor=majorDays.indexOf(i+1)!==-1;
      return '<circle cx="'+cx(i).toFixed(1)+'" cy="'+byRev(v).toFixed(1)+'" r="'+(isMajor?3:1.8)+'" fill="'+(isMajor?'#f59e0b':'#1f2937')+'">'
        +'<title>'+(i+1)+'일 목표매출 누적 '+fmtNum(v)+(isMajor?' (메이저 업데이트)':'')+'</title></circle>';
    }).join('');
    targetLine='<path d="'+linePath(cumTarget)+'" fill="none" stroke="#1f2937" stroke-width="1.8" stroke-dasharray="6 4" opacity=".8"/>'+tDots;
  }
  revLines+=targetLine+'<path d="'+linePath(cumThis)+'" fill="none" stroke="#8b5cf6" stroke-width="2.6"/>'+dotsFor(cumThis,'#8b5cf6',2.8,'매출');

  var lines='',legend=lgChip('#8b5cf6','매출(누적)',fmtNum(cumThis[n-1]))
    +(hasPrev?lgChip('#c4b5fd','전월 동기(누적)',fmtNum(cumPrev[n-1])):'')
    +(hasLY?lgChip('#9ca3af','작년 동월(누적)',fmtNum(cumLY[n-1])):'')
    +(cumTarget?lgChip('#1f2937','목표매출(누적)',fmtNum(cumTarget[n-1]||cumTarget[Math.min(n,totalSlots)-1])):'')
    +(majorDays.length?lgChip('#f59e0b','메이저 업데이트',majorDays.join(', ')+'일'):'');

  // 선 3종(일별 값, 각자 min~max로 정규화) — DAU·PU·ARPPU는 누적 개념이 아니므로 그대로 일별 값을 쓴다
  // DAU는 매출과 확실히 구분되도록 파랑, PU·ARPPU는 점선으로 구분
  var lineDefs=[{key:'dau',label:'DAU',color:'#2563eb',dash:''},
                {key:'pu',label:'PU',color:'#0d9488',dash:'5 4'},
                {key:'arppu',label:'ARPPU',color:'#f59e0b',dash:'2 3'}];
  lineDefs.forEach(function(L){
    var vs=days.map(function(d){return Number(d[L.key])||0;});
    var mx=Math.max.apply(null,vs);
    if(!mx) return;
    // ⚠ 각 선을 min~max로 늘리면 2%밖에 안 변한 DAU도 급등락처럼 보인다.
    //   0을 바닥으로 잡아 실제 변동 폭 그대로 보이게 한다.
    var top=mx*1.1;
    function ly(v){ return PT+plotH*0.06+plotH*0.9*(1-v/top); }
    var pts=vs.map(function(v,i){return cx(i).toFixed(1)+','+ly(v).toFixed(1);});
    var dots=vs.map(function(v,i){
      var y=ly(v);
      return '<circle cx="'+cx(i).toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.4" fill="#fff" stroke="'+L.color+'" stroke-width="1.6">'
        +'<title>'+esc(days[i].date)+' '+L.label+' '+fmtNum(v)+'</title></circle>';
    }).join('');
    lines+='<path d="M'+pts.join(' L')+'" fill="none" stroke="'+L.color+'" stroke-width="2" stroke-linejoin="round"'
      +(L.dash?' stroke-dasharray="'+L.dash+'"':'')+'/>'+dots;
    legend+='<span class="inline-flex items-center gap-1 text-[10px] font-bold" style="color:'+L.color+'">'
      +'<span style="width:8px;height:8px;border-radius:2px;background:'+L.color+';display:inline-block"></span>'+L.label
      +' <span class="text-gray-500">'+fmtNum(vs[n-1])+'</span></span>';
  });

  // x축(월말까지, 며칠 간격으로만 표기) — 슬롯 i는 곧 "그 달의 (i+1)일"이므로 날짜를 바로 계산한다
  var step=Math.max(1,Math.ceil(totalSlots/12)),xl='';
  for(var i2=0;i2<totalSlots;i2+=step){
    xl+='<text x="'+cx(i2).toFixed(1)+'" y="'+(H-10)+'" font-size="9" fill="#9ca3af" text-anchor="middle">'+(i2+1)+'</text>';
  }
  // 마우스를 올리면 그날 값 전부를 보여주는 투명 히트영역 + 세로 가이드
  var hit='';
  days.forEach(function(d,i){
    var info={d:d.date,rev:d.revenue,dau:d.dau,pu:d.pu,arppu:d.arppu,
              cum:cumThis[i],target:cumTarget?cumTarget[i]:0,
              prev:cumPrev?cumPrev[i]:0,ly:cumLY?cumLY[i]:0};
    hit+='<rect x="'+(cx(i)-slot/2).toFixed(1)+'" y="'+PT+'" width="'+slot.toFixed(1)+'" height="'+plotH.toFixed(1)+'" fill="transparent" '
      +'onmouseover="dgTip(event,\''+encodeURIComponent(JSON.stringify(info))+'\')" onmouseout="dgTipHide()" style="cursor:crosshair"/>';
  });
  var svg='<div style="position:relative">'
    +'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+grid+majorMarkers+revLines+lines+xl+hit+'</svg>'
    +'<div id="dg-tip" style="display:none;position:absolute;z-index:20;pointer-events:none;background:#111827;color:#fff;'
    +'padding:8px 10px;border-radius:8px;font-size:11px;line-height:1.6;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)"></div></div>';
  var mLabel=(+days[0].date.slice(5,7))+'월';

  // 같은 기간 비교: 당월 누적 vs 전월 동기 누적 (시트가 제공하는 값)
  var cmp=window._dailyCompareCache||{},m=window._monthlyRawCache||{},cmpHtml='';
  function chip(lb,val,cls){
    return '<div class="bg-gray-50 border border-gray-100 rounded-lg px-3 py-2 text-center min-w-[104px]">'
      +'<div class="text-[10px] text-gray-400 font-bold">'+lb+'</div>'
      +'<div class="text-sm font-extrabold '+(cls||'text-gray-900')+' mt-0.5">'+val+'</div></div>';
  }
  function sign(p){ return String(p).indexOf('-')!==-1?'text-blue-600':'text-red-500'; }
  var curSum=cmp.cur||revs.reduce(function(a,b){return a+b;},0)||m.revenue||0;
  if(curSum){
    cmpHtml='<div class="flex items-center gap-2 flex-wrap mb-3">'
      +chip(mLabel+' 누적(1일~오늘)',fmtNum(curSum))
      +(cmp.prev?chip('전월 동기 누적',fmtNum(cmp.prev)):'')
      +(cmp.prevPct?chip('전월 동기 대비',cmp.prevPct,sign(cmp.prevPct)):'')
      +(cmp.lastYear?chip('전년 동기 누적',fmtNum(cmp.lastYear)):'')
      +(cmp.lastYearPct?chip('전년 동기 대비',cmp.lastYearPct,sign(cmp.lastYearPct)):'')
      +'</div>';
  }

  return '<div class="card-header" style="padding:0;margin:18px 0 12px"><span class="card-title"><i class="ti ti-chart-histogram text-violet-500"></i> 글로벌 일별 추이 <span class="text-[11px] text-gray-400 font-medium ml-1">'+mLabel+' 1일~'+totalSlots+'일 · 실적은 오늘까지</span></span>'
    +'<span class="text-[11px] text-gray-400 font-medium">굵은 선=누적매출 · 검정 점선=목표매출(누적) · 가는 선=DAU·PU·ARPPU(값은 마우스오버)</span></div>'
    +'<div class="card">'+cmpHtml+'<div class="flex items-center justify-end gap-2.5 flex-wrap mb-2">'+legend+'</div>'+svg+'</div>';
}

/* ── AI ── */
function renderKpiPage(){
  var c=document.getElementById('content-area');
  var regions=window._regionsCache||{};
  var an=window._annualCache||{};
  var now=new Date(),mon=now.getMonth()+1;
  var defs=[
    {key:'kr',label:'🇰🇷 한국',color:'red'},
    {key:'tw',label:'🇹🇼 대만',color:'blue'},
    {key:'jp',label:'🇯🇵 일본',color:'emerald'},
    {key:'gl',label:'🌐 글로벌',color:'purple'}
  ];
  function mk(label,val,change){
    var isD=(change||'').indexOf('▼')!==-1||(change||'').indexOf('-')!==-1;
    return'<div class="py-1 flex items-center justify-between"><span class="text-[11px] text-gray-500">'+label+'</span><div class="flex items-center gap-1.5"><span class="text-xs font-bold text-gray-900">'+fmtNum(val)+'</span>'+(change?'<span class="text-[10px] font-bold '+(isD?'text-blue-600':'text-red-500')+'">'+change+'</span>':'')+'</div></div>';
  }
  // 당월 누적 매출 기준 실제 달성률 (계획 대비 / 추정 대비)
  // actual: 원 단위, planM/estM: 백만원 단위
  function cumRateHtml(actual,planM,estM){
    if(!actual)return'';
    function one(label,tgtM){
      if(!tgtM)return'';
      var pct=actual/(tgtM*1000000)*100;
      var c=pct>=100?'emerald':pct>=90?'blue':pct>=70?'amber':'red';
      return'<div class="flex items-center justify-between py-0.5"><span class="text-[10px] text-gray-500">'+label+'</span><span class="text-[10px] font-bold text-'+c+'-600">'+pct.toFixed(1)+'%</span></div>';
    }
    return one('계획 대비',planM)+one('추정 대비',estM);
  }
  // '당월 누적 매출' 한 줄 (전월비 뱃지 포함)
  function cumRevRow(m){
    if(!m||!m.revenue)return'';
    var dn=(m.revenueChange||'').indexOf('▼')!==-1||(m.revenueChange||'').indexOf('-')!==-1;
    return'<div class="flex items-center justify-between py-0.5"><span class="text-[10px] text-gray-500">당월 누적</span>'
      +'<span class="flex items-center gap-1"><span class="text-[11px] font-extrabold text-gray-900">'+fmtNum(m.revenue)+'</span>'
      +(m.revenueChange?'<span class="text-[9px] font-bold '+(dn?'text-blue-600':'text-red-500')+'">'+m.revenueChange+'</span>':'')+'</span></div>';
  }
  function rCard(def){
    var d=regions[def.key];
    if(!d||!d.weekly||!d.weekly.dau) return'<div class="card border-'+def.color+'-200"><div class="font-bold text-sm text-'+def.color+'-700 mb-3">'+def.label+'</div><p class="text-xs text-gray-400 text-center py-4">데이터 로딩 중</p></div>';
    var w=d.weekly,ch=w.change||{},m=d.monthly||{};
    var weeklyHtml=mk('DAU',w.dau,ch.dau)+mk('NRU',w.nru,ch.nru)+mk('WAU',w.wau,ch.wau)+mk('매출',w.revenue,ch.revenue)+mk('PU',w.pu,ch.pu)+mk('ARPPU',w.arppu,ch.arppu);
    var tgt=d.target||{},ann=d.annual||{};
    // 목표 블록 순서: 계획/추정 → 추정/계획 → (구분선) → 당월 누적 → 계획 대비 → 추정 대비
    // 누적 실적을 달성률 바로 위에 두어 "얼마 벌어서 몇 %"가 한눈에 읽히게 한다.
    var monthlyHtml='',targetHtml2='';
    if(tgt.plan){
      var aN=parseFloat(String(tgt.achieve||'').replace(/[^0-9.]/g,''))||0;
      var aC=aN>=100?'emerald':aN>=90?'blue':aN>=80?'amber':'red';
      var actualBlock=m.revenue?'<div class="mt-1.5 pt-1.5 border-t border-dashed border-gray-200">'+cumRevRow(m)+cumRateHtml(m.revenue,tgt.plan,tgt.estimate)+'</div>':'';
      targetHtml2='<div class="mt-2.5 pt-2.5 border-t border-'+def.color+'-100"><div class="text-[10px] font-bold text-'+def.color+'-400 mb-1">🎯 '+mon+'월 목표</div><div class="flex items-center justify-between py-0.5"><span class="text-[10px] text-gray-500">계획/추정</span><span class="text-[10px] font-bold text-gray-700">'+fmtNum(tgt.plan*1000000)+' / '+fmtNum(tgt.estimate*1000000)+'</span></div><div class="flex items-center justify-between py-0.5"><span class="text-[10px] text-gray-500">추정/계획</span><span class="text-[10px] font-bold text-'+aC+'-600">'+tgt.achieve+'</span></div>'
        +actualBlock+'</div>';
    } else if(m.revenue){
      // 목표가 없는 권역은 당월 누적만 따로 보여준다
      monthlyHtml='<div class="mt-2.5 pt-2.5 border-t border-'+def.color+'-100"><div class="text-[10px] font-bold text-'+def.color+'-400 mb-1">📊 당월 누적</div>'+cumRevRow(m)+'</div>';
    }
    var annualHtml2='';
    if(ann.plan){
      var bN=parseFloat(String(ann.achieve||'').replace(/[^0-9.]/g,''))||0;
      var bC=bN>=90?'emerald':bN>=80?'blue':'amber';
      annualHtml2='<div class="mt-2.5 pt-2.5 border-t border-'+def.color+'-100"><div class="text-[10px] font-bold text-'+def.color+'-400 mb-1">📅 연간</div><div class="flex items-center justify-between py-0.5"><span class="text-[10px] text-gray-500">계획/추정</span><span class="text-[10px] font-bold text-gray-700">'+fmtNum(ann.plan*1000000)+' / '+fmtNum(ann.estimate*1000000)+'</span></div><div class="flex items-center justify-between py-0.5"><span class="text-[10px] text-gray-500">달성률</span><span class="text-[10px] font-bold text-'+bC+'-600">'+ann.achieve+'</span></div>'
        +(ann.cumulative?'<div class="flex items-center justify-between py-0.5"><span class="text-[10px] text-gray-500">누적매출</span><span class="text-[10px] font-bold text-gray-700">'+fmtNum(ann.cumulative*1000000)+(ann.cumulativePct?' <span class="text-[9px] font-bold text-'+bC+'-600">'+ann.cumulativePct+'</span>':'')+'</span></div>':'')
        +'</div>';
    }
    return'<div class="card border-'+def.color+'-200 hover:shadow-md transition-all"><div class="flex items-center justify-between mb-2"><span class="font-bold text-sm text-'+def.color+'-700">'+def.label+'</span><span class="text-[10px] font-bold bg-'+def.color+'-50 text-'+def.color+'-600 px-2 py-0.5 rounded">전주비</span></div><div class="divide-y divide-gray-50">'+weeklyHtml+'</div>'+targetHtml2+monthlyHtml+annualHtml2+'</div>';
  }
  var targetHtml='';
  if(an.monthlyTarget&&an.monthlyTarget.plan){
    var mt=an.monthlyTarget;
    var achNum=parseFloat(String(mt.achieve||'').replace(/[^0-9.]/g,''))||0;
    var achClr=achNum>=100?'emerald':achNum>=90?'blue':achNum>=80?'amber':'red';
    targetHtml='<div class="card"><div class="font-bold text-sm text-gray-800 mb-3"><i class="ti ti-target text-indigo-500"></i> '+mon+'월 목표</div><div class="grid grid-cols-3 gap-3 text-center"><div class="bg-gray-50 p-3 rounded-xl"><div class="text-[10px] text-gray-400 font-bold">계획</div><div class="text-base font-extrabold text-gray-900 mt-1">'+fmtNum(mt.plan*1000000)+'</div></div><div class="bg-gray-50 p-3 rounded-xl"><div class="text-[10px] text-gray-400 font-bold">추정</div><div class="text-base font-extrabold text-gray-900 mt-1">'+fmtNum(mt.estimate*1000000)+'</div></div><div class="bg-'+achClr+'-50 p-3 rounded-xl"><div class="text-[10px] text-'+achClr+'-600 font-bold">추정/계획</div><div class="text-base font-extrabold text-'+achClr+'-700 mt-1">'+mt.achieve+'</div></div></div></div>';
  }
  var annualHtml='';
  if(an.quarterly&&an.quarterly.length){
    var qRows=an.quarterly.map(function(q){
      var pNum=parseFloat(String(q.pct||'').replace(/[^0-9.]/g,''))||0;
      var pClr=pNum>=95?'emerald':pNum>=85?'blue':'amber';
      return'<div class="flex items-center justify-between py-1.5"><span class="text-xs text-gray-600">'+esc(q.label)+'</span><div class="flex items-center gap-2"><span class="text-xs font-bold">'+fmtNum(q.value*1000000)+'</span><span class="text-[10px] font-bold text-'+pClr+'-600 bg-'+pClr+'-50 px-1.5 py-0.5 rounded">'+q.pct+'</span></div></div>';
    }).join('');
    var totRow='';
    if(an.totalPlan){
      var aClr=parseFloat(String(an.totalAchieve||'').replace(/[^0-9.]/g,''))>=90?'emerald':'amber';
      totRow='<div class="flex items-center justify-between pt-2 mt-1 border-t-2 border-gray-200"><span class="text-xs font-bold">연간 합계</span><div class="text-right"><div class="text-[10px] text-gray-400">계획 '+fmtNum(an.totalPlan*1000000)+' · 추정 '+fmtNum(an.totalEstimate*1000000)+'</div><div class="text-xs font-bold text-'+aClr+'-600">달성 '+an.totalAchieve+'</div></div></div>';
    }
    annualHtml='<div class="card"><div class="font-bold text-sm text-gray-800 mb-3"><i class="ti ti-coin text-amber-500"></i> 연간 매출 현황</div>'+qRows+totRow+'</div>';
  }
  var cardsHtml=defs.map(rCard).join('');
  c.innerHTML='<div class="card-header" style="padding:0;margin-bottom:12px"><span class="card-title"><i class="ti ti-trending-up text-emerald-500"></i> 전권역 주간 매출 추이</span><a href="https://drive.google.com/drive/folders/1lk_9pMhvy343Wx7J2sHbGIYRo2c-x7vQ" target="_blank" class="btn btn-sm"><i class="ti ti-folder"></i> 보고 폴더</a></div>'+
    '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">'+cardsHtml+'</div>'+
    renderTrendCharts()+
    renderMonthlyCharts()+
    renderDailyGlobal();
}

/* ═══════════════════════════════════════════
   유저 분포 — 누적PU당일접속 / 전투력별DAU / 레벨별DAU
   구간(결제금액·전투력·레벨)을 x축에 둔 라인차트로, "기준 기간" vs "비교 기간" 두 시점의
   분포 모양을 겹쳐 보여준다. 레벨(100구간)까지 있어 색상별 범례 대신 2계열 비교로 설계.
   주간/월간 토글 + 기간 선택 드롭다운으로 임의의 두 구간을 비교한다.
   ═══════════════════════════════════════════ */
var UD_TABS=[{key:'pu',icon:'ti-coin',clr:'violet'},{key:'power',icon:'ti-swords',clr:'red'},{key:'level',icon:'ti-chart-bar',clr:'blue'},
  {key:'chapter',icon:'ti-bookmark',clr:'emerald'},{key:'segment',icon:'ti-users-group',clr:'orange'}];
var UD_METRIC_HEX={pu:'#7c3aed',power:'#dc2626',level:'#2563eb',chapter:'#059669',segment:'#ea580c'};

// CP&PAY 라벨 정리:
//  · "둘다_*"는 무엇의 교집합인지 알기 어려워 조건을 풀어쓴다
//  · "누적"/"3M" 접두사는 "(누적)"/"(최근3개월)"로 뒤에 풀어써서 기간 구분을 명확히 한다
//    (컬럼명 하나하나를 등록하는 대신 접두사 규칙으로 처리 — 나중에 컬럼이 늘어도 그대로 작동)
//  · 미분류_점검(운영/점검용 잡음)은 화면에서 뺀다
var UD_SEGMENT_EXCLUDE=['미분류_점검'];
function udSegmentKeepIdx_(buckets){
  var idx=[]; buckets.forEach(function(b,i){ if(UD_SEGMENT_EXCLUDE.indexOf(b)===-1) idx.push(i); }); return idx;
}
function udSegmentRelabel_(b){
  var s=String(b), suffix='';
  if(/^누적/.test(s)){ suffix='(누적)'; s=s.replace(/^누적_?/,''); }
  else if(/^3M/i.test(s)){ suffix='(최근3개월)'; s=s.replace(/^3M_?/i,''); }
  s=s.replace(/둘다/g,'전투력3만&결제100만이상');
  return s+suffix;
}
function udPick_(arr,idx){ return arr?idx.map(function(i){ return arr[i]; }):arr; }

// 결제금액 세분 구간(1만원 이하~1억원 초과)을 업무상 보는 7개 그룹으로 묶는다.
// upto는 원본 버킷 라벨과 정확히 일치해야 그 구간에서 그룹을 끊는다.
var UD_PU_GROUPS=[
  {label:'1만원~10만원', upto:'10만원 이하'},
  {label:'~500만원',    upto:'500만원 이하'},
  {label:'~1000만원',   upto:'1000만원 이하'},
  {label:'~3000만원',   upto:'3000만원 이하'},
  {label:'~5000만원',   upto:'5000만원 이하'},
  {label:'~1억원',      upto:'1억원 이하'},
  {label:'1억원 초과',   upto:'1억원 초과'}
];
// buckets 순서대로 훑다가 UD_PU_GROUPS의 upto 라벨을 만날 때마다 그룹을 하나 닫아 합산값을 쌓는다.
// upto와 매칭되지 않는 라벨이 남으면(원본 구간명이 바뀐 경우) 마지막 그룹에 합쳐 데이터 유실을 막는다.
function udGroupPuValues_(buckets,arr){
  if(!arr) return null;
  var out=[], gi=0, sum=0;
  buckets.forEach(function(b,i){
    sum+=arr[i]||0;
    if(gi<UD_PU_GROUPS.length-1 && b===UD_PU_GROUPS[gi].upto){ out.push(sum); sum=0; gi++; }
  });
  out.push(sum);   // 마지막 그룹(또는 매칭 안 된 잔여분)
  while(out.length<UD_PU_GROUPS.length) out.push(0);
  return out;
}

function renderUserDist(){
  var c=document.getElementById('content-area');
  if(!window._userDistCache){
    c.innerHTML='<div class="card"><p class="text-xs text-gray-400 text-center py-10"><i class="ti ti-loader-2 animate-spin"></i> 유저 분포 데이터 불러오는 중...</p></div>';
    udFetch();
    return;
  }
  var d=window._userDistCache;
  if(!d||!d.ok){
    var hint=d&&d.tabs?'<div class="text-[11px] text-gray-400 mt-2">시트 내 탭: '+esc(d.tabs.join(', '))+'</div>':'';
    c.innerHTML='<div class="card"><div class="text-center py-10"><i class="ti ti-alert-triangle text-amber-500" style="font-size:28px"></i>'
      +'<p class="text-xs text-gray-500 mt-2">데이터를 불러오지 못했습니다'+(d&&d.error?' ('+esc(d.error)+')':'')+'</p>'+hint
      +'<button class="btn btn-sm btn-primary mt-3" onclick="udRefresh()"><i class="ti ti-refresh"></i> 다시 시도</button></div></div>';
    return;
  }
  window._udMetric=window._udMetric&&d.sets[window._udMetric]?window._udMetric:(UD_TABS.filter(function(o){return d.sets[o.key];})[0]||{}).key;
  window._udMode=window._udMode||'weekly';
  window._udValueMode=window._udValueMode||'count';

  var cur=d.sets[window._udMetric];
  var rows=(window._udMode==='weekly'?cur.weekly:cur.monthly)||[];
  udEnsureCompare_(rows.length);

  var tabs=UD_TABS.filter(function(o){return d.sets[o.key];}).map(function(o){
    var s=d.sets[o.key],active=window._udMetric===o.key;
    return'<button class="btn btn-sm'+(active?' btn-primary':'')+'" onclick="udSetMetric(\''+o.key+'\')"><i class="ti '+o.icon+'"></i> '+esc(s.label)+'</button>';
  }).join('');
  function seg(group,opts,cur2){
    return'<div class="flex items-center gap-1 bg-gray-100 p-1 rounded-lg">'+opts.map(function(o){
      var active=cur2===o.v;
      return'<button class="btn btn-sm" style="border:none;'+(active?'background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700':'background:transparent;color:#9ca3af')+'" onclick="'+group+'(\''+o.v+'\')">'+o.l+'</button>';
    }).join('')+'</div>';
  }
  var modeToggle=seg('udSetMode',[{v:'weekly',l:'주간'},{v:'monthly',l:'월간'}],window._udMode);
  var valueToggle=seg('udSetValueMode',[{v:'count',l:'유저수'},{v:'pct',l:'비중%'}],window._udValueMode);

  var periodOpts=rows.map(function(r,i){return'<option value="'+i+'">'+esc(r.label)+'</option>';}).join('');
  var periodPickers='<div class="flex items-center gap-2 flex-wrap text-[11px] text-gray-500">'
    +'<span class="inline-flex items-center gap-1.5"><span style="width:9px;height:9px;border-radius:2px;background:'+UD_METRIC_HEX[window._udMetric]+';display:inline-block"></span>기준 '
    +'<select class="!w-auto !py-1 !px-2 text-[11px]" onchange="udSetCompare(\'a\',this.value)">'+periodOpts+'</select></span>'
    +'<span class="inline-flex items-center gap-1.5"><span style="width:9px;height:9px;border-radius:2px;background:#cbd5e1;display:inline-block"></span>비교 '
    +'<select class="!w-auto !py-1 !px-2 text-[11px]" onchange="udSetCompare(\'b\',this.value)">'+periodOpts+'</select></span></div>';
  // select에 현재 선택값 반영 (렌더 직후 DOM에서 세팅)
  window._udPickerSync=true;

  c.innerHTML='<div class="card-header" style="padding:0;margin-bottom:12px"><span class="card-title"><i class="ti ti-users-group text-indigo-500"></i> 유저 분포</span>'
    +'<button class="btn btn-sm" onclick="udRefresh()" title="새로고침"><i class="ti ti-refresh"></i></button></div>'
    +'<div class="card"><div class="flex items-center justify-between flex-wrap gap-2 mb-2"><div class="flex gap-1.5 flex-wrap">'+tabs+'</div>'
    +'<div class="flex items-center gap-2 flex-wrap">'+valueToggle+modeToggle+'</div></div>'
    +'<div class="flex items-center justify-between flex-wrap gap-2 pb-2 border-b border-gray-100">'+periodPickers
    +'<span class="text-[10px] text-gray-400">'+esc(cur.tab)+' · 일평균 기준 최근 '+rows.length+(window._udMode==='weekly'?'주':'개월')+'</span></div>'
    +'<div id="ud-chart-wrap"></div></div>';

  var selA=c.querySelector('select[onchange^="udSetCompare(\'a\'"]');
  var selB=c.querySelector('select[onchange^="udSetCompare(\'b\'"]');
  if(selA) selA.value=window._udCompare.aIdx;
  if(selB) selB.value=window._udCompare.bIdx;

  udRenderChart();
}

function udFetch(){
  fetch(KPI_API_URL+'?action=user_dist&t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){ window._userDistCache=d; if(currentPage==='user-dist') renderUserDist(); })
    .catch(function(e){
      window._userDistCache={ok:false,error:e.message};
      if(currentPage==='user-dist') renderUserDist();
    });
}
function udRefresh(){ window._userDistCache=null; renderUserDist(); }
function udSetMetric(k){ window._udMetric=k; window._udCompare=null; renderUserDist(); }
function udSetMode(m){ window._udMode=m; window._udCompare=null; renderUserDist(); }
function udSetValueMode(m){ window._udValueMode=m; renderUserDist(); }
function udSetCompare(which,idx){
  window._udCompare=window._udCompare||{};
  window._udCompare[which==='a'?'aIdx':'bIdx']=parseInt(idx,10);
  udRenderChart();
}
// 기간(주/월) 개수가 바뀌면(=지표·모드 전환) 기준=최신, 비교=직전으로 되돌린다
function udEnsureCompare_(n){
  var cmp=window._udCompare;
  if(!cmp||cmp.aIdx==null||cmp.bIdx==null||cmp.aIdx>=n||cmp.bIdx>=n){
    window._udCompare={aIdx:Math.max(0,n-1),bIdx:Math.max(0,n-2)};
  }
}

// 저액/저구간 쪽 유저수가 압도적으로 많아 전체 분포에서는 꼬리 쪽이 눌려 보이므로,
// PU·전투력은 특정 구간부터(전투력은 ~구간까지) 잘라서 보여주는 확대 차트를 하나 더 그린다.
// 전투력은 12만 이후가 전부 0이라 "전체 분포" 쪽도 같은 12만에서 끊어 위아래 축을 맞춘다.
// 레벨은 별도 확대 없이 전체 분포만 보여준다.
var UD_RANGE={
  pu:    { zoom: {fromLabel:'3만원 이하'} },
  power: { main: {toValue:120000}, zoom: {fromValue:40000,toValue:120000} }
};
function udResolveRange_(buckets,spec){
  if(!spec) return null;
  var start=0,end=buckets.length-1;
  if(spec.fromLabel){
    var idx=buckets.indexOf(spec.fromLabel);
    if(idx<0) return null;
    start=idx;
  }
  if(spec.fromValue!=null){
    var s=-1;
    for(var i=0;i<buckets.length;i++){ var n=Number(buckets[i]); if(!isNaN(n)&&n>=spec.fromValue){ s=i; break; } }
    if(s<0) return null;
    start=s;
  }
  if(spec.toValue!=null){
    var e=-1;
    for(var j=buckets.length-1;j>=0;j--){ var n2=Number(buckets[j]); if(!isNaN(n2)&&n2<=spec.toValue){ e=j; break; } }
    if(e>=start) end=e;
  }
  return(start>0||end<buckets.length-1)?{start:start,end:end}:null;
}

function udRenderChart(){
  var d=window._userDistCache, cur=d.sets[window._udMetric];
  var wrap=document.getElementById('ud-chart-wrap');
  if(!cur){ wrap.innerHTML='<p class="text-xs text-gray-400 text-center py-10">표시할 데이터가 없습니다</p>'; return; }
  var rows=(window._udMode==='weekly'?cur.weekly:cur.monthly)||[];
  if(!rows.length){ wrap.innerHTML='<p class="text-xs text-gray-400 text-center py-10">표시할 구간이 없습니다</p>'; return; }
  var buckets=cur.buckets;
  udEnsureCompare_(rows.length);
  var rowA=rows[window._udCompare.aIdx], rowB=rows[window._udCompare.bIdx];
  if(!rowA) rowA=rows[rows.length-1];

  // 분포 모양 비교가 목적이므로 x축은 "구간"(전투력·레벨·결제구간), y축은 유저수(또는 비중%)
  var pctMode=window._udValueMode==='pct';
  function seriesVals(row){
    if(!row) return buckets.map(function(){return 0;});
    if(!pctMode) return row.values;
    var total=row.values.reduce(function(a,b){return a+b;},0)||1;
    return row.values.map(function(v){return v/total*100;});
  }
  var valsA=seriesVals(rowA), valsB=rowB?seriesVals(rowB):null;
  var metricHex=UD_METRIC_HEX[window._udMetric]||'#7c3aed';
  var axisLabelMap={pu:'결제금액 구간',power:'전투력 구간',level:'레벨 구간',chapter:'챕터',segment:'CP&PAY 항목'};
  var axisLabel=axisLabelMap[window._udMetric]||'구간';
  function slice(range,arr){ return range&&arr?arr.slice(range.start,range.end+1):arr; }

  var rangeCfg=UD_RANGE[window._udMetric]||{};
  window._udChartCache={};

  var mainRange=udResolveRange_(buckets,rangeCfg.main);
  var html;
  if(window._udMetric==='segment'){
    // CP&PAY 항목은 서로 다른(일부 교집합) 조건별 인원수라 차트로 이으면 왜곡되고,
    // 규모 차이도 커서(Lv40+ 2만대 vs 둘다_북미 수백대) 공유축 그래프 자체가 안 맞는다.
    // → 항목별 숫자 카드로 대신한다. "둘다_*"는 무엇의 교집합인지 라벨에 풀어쓰고,
    // 미분류_점검은 운영/점검용 잡음이라 화면에서 제외한다.
    var keepIdx=udSegmentKeepIdx_(buckets);
    var segBuckets=keepIdx.map(function(i){ return udSegmentRelabel_(buckets[i]); });
    var segValsA=udPick_(valsA,keepIdx), segValsB=valsB?udPick_(valsB,keepIdx):null;
    html=udStatCards_(segBuckets,segValsA,segValsB,rowA,rowB,pctMode,metricHex);
  }else{
    html=udChartBlock_('main','전체 분포',slice(mainRange,buckets),slice(mainRange,valsA),slice(mainRange,valsB),rowA,rowB,pctMode,metricHex,axisLabel,false,window._udMetric==='chapter');
  }

  var zoomRange=udResolveRange_(buckets,rangeCfg.zoom);
  if(zoomRange){
    var zoomTitle=(window._udMetric==='pu'?'3만원 이하 이후':'전투력 4만~12만')+' 확대';
    html+='<div class="mt-5 pt-4 border-t border-dashed border-gray-200">'
      +udChartBlock_('zoom',zoomTitle,slice(zoomRange,buckets),slice(zoomRange,valsA),slice(zoomRange,valsB),rowA,rowB,pctMode,metricHex,axisLabel,true)+'</div>';
  }

  // 표는 주간/월간 토글과 무관하게 "이번달 vs 지난달"을 항상 같이 보여준다 (전월대비 참고용 고정 컬럼)
  var monthly=cur.monthly||[];
  var monA=monthly[monthly.length-1], monB=monthly[monthly.length-2];

  // 전투력: 4만~12만 구간별 인원수를 표로도 제공 (차트와 같은 범위)
  // 원본 시트가 5,000단위로만 쌓이므로 표도 5,000단위 그대로 — 1,000단위로 더 잘게 보려면
  // 원본 SQL/시트의 구간 폭 자체를 1,000단위로 바꿔야 한다.
  if(window._udMetric==='power'){
    var tblRange=udResolveRange_(buckets,{fromValue:40000,toValue:120000});
    if(tblRange) html+=udDistTable_({
      title:'전투력 4만~12만 구간별 인원수', note:'(5,000단위 원본 그대로)',
      buckets:slice(tblRange,buckets),
      labelFn:function(b){ var n=Number(b); return n.toLocaleString('ko-KR')+' ~ '+(n+4999).toLocaleString('ko-KR'); },
      weekA:slice(tblRange,rowA.values), weekB:rowB?slice(tblRange,rowB.values):null,
      weekLabelA:rowA.label, weekLabelB:rowB?rowB.label:null,
      monA:monA?slice(tblRange,monA.values):null, monB:monB?slice(tblRange,monB.values):null,
      monLabelA:monA?monA.label:null, monLabelB:monB?monB.label:null
    });
  }

  // PU: 세분화된 결제금액 구간(1만원 이하~1억원 초과)을 요청받은 7개 그룹으로 묶어 표로 제공
  // TOTAL_UCNT는 합계값이라 그룹 합산에서 제외
  if(window._udMetric==='pu'){
    var gRange=buckets[0]==='TOTAL_UCNT'?{start:1,end:buckets.length-1}:{start:0,end:buckets.length-1};
    var gBuckets=slice(gRange,buckets);
    // UD_PU_GROUPS는 합산 로직상 저액→고액 순으로 정의돼 있지만, 표시는 1그룹=고액(1억원 초과) 순으로
    // 뒤집는다 — 결제 규모가 큰 유저 그룹일수록 우선순위가 높다는 업무상 통념에 맞춤.
    function rev(arr){ return arr?arr.slice().reverse():arr; }
    var groupLabels=rev(UD_PU_GROUPS.map(function(g){ return g.label; }));
    html+=udDistTable_({
      title:'결제금액 구간별 인원수', note:'1그룹=고액 → 7그룹=저액',
      buckets:groupLabels,
      labelFn:function(lb,i){ return(i+1)+'그룹 · '+lb; },
      weekA:rev(udGroupPuValues_(gBuckets,slice(gRange,rowA.values))),
      weekB:rowB?rev(udGroupPuValues_(gBuckets,slice(gRange,rowB.values))):null,
      weekLabelA:rowA.label, weekLabelB:rowB?rowB.label:null,
      monA:monA?rev(udGroupPuValues_(gBuckets,slice(gRange,monA.values))):null,
      monB:monB?rev(udGroupPuValues_(gBuckets,slice(gRange,monB.values))):null,
      monLabelA:monA?monA.label:null, monLabelB:monB?monB.label:null
    });
  }

  // 챕터별 진도·CP&PAY는 아직 원본 데이터가 며칠 안 돼서 주간/월간 비교보다
  // "일별 원본을 그대로 쌓아" 보여주는 표가 더 유용하다 — 매일 미러가 돌 때마다 한 줄씩 늘어난다.
  if((window._udMetric==='chapter'||window._udMetric==='segment')&&cur.daily&&cur.daily.length){
    if(window._udMetric==='segment'){
      var dKeepIdx=udSegmentKeepIdx_(cur.buckets);
      var dBuckets=dKeepIdx.map(function(i){ return udSegmentRelabel_(cur.buckets[i]); });
      var dDaily=cur.daily.map(function(r){ return { date:r.date, values:udPick_(r.values,dKeepIdx) }; });
      html+=udDailyLogTable_(dBuckets,dDaily,true);
    }else{
      html+=udDailyLogTable_(cur.buckets,cur.daily,false);
    }
  }
  wrap.innerHTML=html;
}

// 일별 원본 로그 표 — 기간 비교가 아니라 "쌓인 날짜만큼" 그대로 나열한다(최신이 위).
function udDailyLogTable_(buckets,daily,isSegment){
  var rows=daily.slice().sort(function(a,b){ return a.date<b.date?1:-1; }).map(function(r){
    return '<tr><td class="p-2 border-r text-gray-700 font-bold">'+esc(r.date)+'</td>'
      +buckets.map(function(b,i){ return'<td class="p-2 border-r text-right">'+((r.values[i]||0).toLocaleString('ko-KR'))+'</td>'; }).join('')
      +'</tr>';
  }).join('');
  var head=buckets.map(function(b){ return'<th class="p-2 font-bold text-gray-700 border-b border-r text-right">'+esc(udBucketLabel_(b))+'</th>'; }).join('');
  return'<div class="mt-5 pt-4 border-t border-dashed border-gray-200">'
    +'<div class="text-[11px] font-bold text-gray-700 mb-2">일별 원본 <span class="font-normal text-gray-400">(미러가 돌 때마다 하루씩 쌓입니다'+(isSegment?' · 항목끼리는 조건이 겹쳐 합계 없음':'')+')</span></div>'
    +'<div class="overflow-x-auto border rounded-xl" style="max-height:360px;overflow-y:auto">'
    +'<table class="w-full text-left border-collapse text-xs">'
    +'<thead class="sticky top-0 bg-gray-100 z-10"><tr><th class="p-2 font-bold text-gray-700 border-b border-r">날짜</th>'+head+'</tr></thead>'
    +'<tbody class="divide-y">'+rows+'</tbody></table></div></div>';
}

// 차트 하나(전체/확대 공용)를 그려 HTML을 반환하고, 툴팁이 참조할 데이터를 chartId로 캐싱한다.
function udChartBlock_(chartId,title,buckets,valsA,valsB,rowA,rowB,pctMode,metricHex,axisLabel,isZoom,barMode){
  window._udChartCache[chartId]={buckets:buckets,valsA:valsA,valsB:valsB,pctMode:pctMode};

  var W=980,H=isZoom?240:320,PL=52,PR=16,PT=18,PB=46;
  var n=buckets.length, plotH=H-PT-PB, plotW=W-PL-PR;
  // 막대 모드는 구간마다 독립된 "칸"이라 점 사이 간격(n-1)이 아니라 칸 개수(n)로 나눠 칸 중앙에 그린다.
  var slot=barMode?plotW/n:(n>1?plotW/(n-1):plotW);
  var maxV=Math.max.apply(null,valsA.concat(valsB||[]))||1, top=maxV*1.15;
  function cx(i){ return barMode?PL+slot*(i+0.5):(n>1?PL+slot*i:PL+plotW/2); }
  function cy(v){ return PT+plotH*(1-v/top); }

  var grid='';
  for(var g=0;g<=4;g++){
    var gv=top*g/4, gy=PT+plotH*(1-g/4);
    grid+='<line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'" stroke="#eef2f7"/>'
      +'<text x="'+(PL-8)+'" y="'+(gy+3.2).toFixed(1)+'" font-size="9" fill="#9ca3af" text-anchor="end">'+esc(pctMode?gv.toFixed(1)+'%':fmtNum(gv))+'</text>';
  }

  var lines='';
  if(barMode){
    // 순서형이 아니거나(진행 단계) 서로 겹치는 조건별 인원수(교집합 포함)라 선으로 이으면
    // 마치 연속적인 추세처럼 보여 오해를 줄 수 있다 — 칸마다 독립된 막대로 그린다.
    var bw=valsB?Math.min(30,slot*0.34):Math.min(38,slot*0.55);
    var gap=valsB?bw*0.18:0;
    buckets.forEach(function(b,i){
      var cxi=cx(i);
      if(valsB){
        var ya=cy(valsA[i]), ha=Math.max(0,PT+plotH-ya);
        var yb=cy(valsB[i]), hb=Math.max(0,PT+plotH-yb);
        lines+='<rect x="'+(cxi-bw-gap/2).toFixed(1)+'" y="'+ya.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ha.toFixed(1)+'" rx="2" fill="'+metricHex+'"/>'
          +'<rect x="'+(cxi+gap/2).toFixed(1)+'" y="'+yb.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hb.toFixed(1)+'" rx="2" fill="#94a3b8" opacity=".75"/>';
      }else{
        var ya2=cy(valsA[i]), ha2=Math.max(0,PT+plotH-ya2);
        lines+='<rect x="'+(cxi-bw/2).toFixed(1)+'" y="'+ya2.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ha2.toFixed(1)+'" rx="2" fill="'+metricHex+'"/>';
      }
    });
  }else{
    function linePath(vals){
      return vals.map(function(v,i){ return (i===0?'M':'L')+cx(i).toFixed(1)+' '+cy(v).toFixed(1); }).join('');
    }
    function areaPath(vals){
      return linePath(vals)+'L'+cx(vals.length-1).toFixed(1)+' '+(PT+plotH)+'L'+cx(0).toFixed(1)+' '+(PT+plotH)+'Z';
    }
    // 점이 너무 촘촘하면(레벨 100구간) 뭉개지므로 구간 간격에 비례해 반지름을 줄인다
    var dotR=Math.max(1.5,Math.min(3,slot*0.16));
    function dots(vals,color,r){
      return vals.map(function(v,i){ return'<circle cx="'+cx(i).toFixed(1)+'" cy="'+cy(v).toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+color+'" stroke="#fff" stroke-width="1"/>'; }).join('');
    }
    if(valsB) lines+='<path d="'+areaPath(valsB)+'" fill="#cbd5e1" opacity=".18"/>'
      +'<path d="'+linePath(valsB)+'" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>'
      +dots(valsB,'#94a3b8',dotR*0.85);
    lines+='<path d="'+areaPath(valsA)+'" fill="'+metricHex+'" opacity=".14"/>'
      +'<path d="'+linePath(valsA)+'" fill="none" stroke="'+metricHex+'" stroke-width="2.25"/>'
      +dots(valsA,metricHex,dotR);
  }

  // x축 라벨: 구간이 많으면(전투력 36, 레벨 100) 촘촘해지므로 10~12개만 골라 표시
  var step=Math.max(1,Math.ceil(n/12));
  var xLabels='';
  for(var i=0;i<n;i+=step){
    xLabels+='<text x="'+cx(i).toFixed(1)+'" y="'+(PT+plotH+16)+'" font-size="9" fill="#9ca3af" text-anchor="middle">'+esc(udBucketLabel_(buckets[i]))+'</text>';
  }

  // 히트영역(구간별 세로 밴드) — 마우스오버 시 정확한 구간 값을 툴팁으로
  var hit='';
  for(var hi=0;hi<n;hi++){
    var bx=(barMode?cx(hi)-slot/2:(hi===0?PL:cx(hi)-slot/2)), bw2=(barMode||n>1?slot:plotW);
    hit+='<rect x="'+bx.toFixed(1)+'" y="'+PT+'" width="'+bw2.toFixed(1)+'" height="'+plotH+'" fill="transparent" onmousemove="udTip(event,'+hi+',\''+chartId+'\')" onmouseleave="udTipHide(\''+chartId+'\')" style="cursor:crosshair"/>';
  }

  var sumA=valsA.reduce(function(a,b){return a+b;},0);
  var sumB=valsB?valsB.reduce(function(a,b){return a+b;},0):0;
  var totalLabel=isZoom?'표시구간 합':'합계';
  var diffPct=valsB&&sumB?((sumA-sumB)/sumB*100):null;
  var diffChip=diffPct==null?'':'<span class="text-[10px] font-bold '+(diffPct<0?'text-blue-600':'text-red-500')+' bg-gray-50 px-1.5 py-0.5 rounded">'+(diffPct>=0?'▲':'▼')+Math.abs(diffPct).toFixed(1)+'%</span>';
  var sumFmt=function(v){ return pctMode?v.toFixed(1)+'%':fmtNum(v); };

  return'<div class="flex items-center justify-between flex-wrap gap-2 '+(isZoom?'mb-2':'mt-3 mb-2')+'">'
    +'<div class="flex items-center gap-3 flex-wrap text-[11px] text-gray-600">'
    +'<span class="font-bold text-gray-700">'+esc(title)+'</span>'
    +'<span class="inline-flex items-center gap-1.5"><span style="width:16px;height:2.5px;background:'+metricHex+';display:inline-block;border-radius:2px"></span>'+esc(rowA.label)+' '+totalLabel+' <b>'+sumFmt(sumA)+'</b></span>'
    +(rowB?'<span class="inline-flex items-center gap-1.5"><span style="width:16px;height:2.5px;background:#94a3b8;display:inline-block;border-radius:2px;background-image:repeating-linear-gradient(90deg,#94a3b8 0 3px,transparent 3px 6px)"></span>'+esc(rowB.label)+' '+totalLabel+' <b>'+sumFmt(sumB)+'</b></span>'+diffChip:'')
    +'</div>'+(isZoom?'':'<span class="text-[10px] text-gray-400">x축: '+esc(axisLabel)+'</span>')+'</div>'
    +'<div style="position:relative"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" onmouseleave="udTipHide(\''+chartId+'\')">'+grid+lines+xLabels+hit+'</svg>'
    +'<div id="ud-tip-'+chartId+'" style="display:none;position:absolute;pointer-events:none;background:#111827;color:#fff;font-size:11px;line-height:1.5;padding:8px 10px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:20;min-width:140px;max-width:240px"></div></div>';
}

// CP&PAY처럼 서로 다른(교집합 포함) 조건별 인원수는 공유축 차트로 비교하면 왜곡되므로
// 항목별 숫자 카드로 대신 보여준다. 항목끼리 합산하지 않는다(교집합이라 합계가 의미 없음).
function udStatCards_(buckets,valsA,valsB,rowA,rowB,pctMode,metricHex){
  var fmtV=function(v){ return pctMode?v.toFixed(1)+'%':v.toLocaleString('ko-KR'); };
  var cards=buckets.map(function(b,i){
    var a=valsA[i]||0, bV=valsB?(valsB[i]||0):null;
    var chip='';
    if(bV!=null){
      var diff=a-bV, up=diff>0;
      var pct=bV?Math.abs(diff/bV*100).toFixed(1)+'%':(diff===0?'0%':'—');
      chip='<span class="kpi-change '+(up?'change-up':diff<0?'change-down':'')+'" style="font-size:10px;padding:1px 6px">'+(diff===0?'0':(up?'▲':'▼')+pct)+'</span>';
    }
    return'<div class="kpi-card" style="padding:14px 16px">'
      +'<div class="kpi-label">'+esc(udBucketLabel_(b))+'</div>'
      +'<div class="kpi-value" style="font-size:22px;color:'+metricHex+'">'+fmtV(a)+'</div>'
      +(bV!=null?'<div class="flex items-center gap-1.5 mt-1"><span class="text-[10px] text-gray-400">'+esc(rowB.label)+' '+fmtV(bV)+'</span>'+chip+'</div>':'')
      +'</div>';
  }).join('');
  return'<div class="grid grid-cols-2 md:grid-cols-4 gap-3">'+cards+'</div>'
    +'<div class="text-[10px] text-gray-400 mt-2">'+esc(rowA.label)+' 기준'+(rowB?' · 비교: '+esc(rowB.label):'')+' · 항목끼리는 조건이 겹쳐 합계를 내지 않음</div>';
}

// 전투력/레벨 구간 라벨을 읽기 좋게 (숫자면 천단위 콤마)
function udBucketLabel_(b){
  var n=Number(b);
  return(b!==''&&!isNaN(n))?n.toLocaleString('ko-KR'):String(b);
}

// 증감을 ▲▼ 화살표로 (포탈 전반의 등락 표기 규칙과 통일: 증가=빨강▲, 감소=파랑▼)
function udDiffArrow_(diff){
  if(!diff) return'<span class="text-gray-400">0</span>';
  var up=diff>0;
  return'<span class="'+(up?'text-red-500':'text-blue-600')+'">'+(up?'▲':'▼')+Math.abs(diff).toLocaleString('ko-KR')+'</span>';
}

// 구간별 인원수 표 — 기준/비교(주간·월간 토글에 연동) 컬럼 + 이번달/지난달(항상 고정) 컬럼을 함께 보여준다.
// opts: {title, note, buckets, labelFn(b,i), weekA, weekB, weekLabelA, weekLabelB, monA, monB, monLabelA, monLabelB}
function udDistTable_(opts){
  var buckets=opts.buckets, weekA=opts.weekA, weekB=opts.weekB, monA=opts.monA, monB=opts.monB;
  var hasWeekB=!!weekB, hasMon=!!(monA&&monB);

  // 열 순서는 항상 "이전 기간 → 최근 기간"으로 보여준다(월간 칸과 동일한 규칙).
  // 기준(A)이 보통 더 최근이라 화면에는 비교(B)를 먼저, 기준(A)을 나중에 놓고,
  // 증감은 그대로 wa-wb(=최근-이전)로 계산해 부호가 안 바뀌게 한다.
  function cell(v,cls){ return'<td class="p-2 border-r text-right'+(cls?' '+cls:'')+'">'+v.toLocaleString('ko-KR')+'</td>'; }
  var rows=buckets.map(function(b,i){
    var wa=weekA[i]||0, wb=hasWeekB?(weekB[i]||0):null;
    var ma=hasMon?(monA[i]||0):null, mb=hasMon?(monB[i]||0):null;
    return'<tr><td class="p-2 border-r text-gray-700">'+esc(opts.labelFn(b,i))+'</td>'
      +(hasWeekB?cell(wb,'text-gray-500')+cell(wa,'font-bold text-gray-900')+'<td class="p-2 border-r text-right font-bold">'+udDiffArrow_(wa-wb)+'</td>':cell(wa,'font-bold text-gray-900'))
      +(hasMon?cell(mb,'text-gray-500')+cell(ma,'font-bold text-gray-900')+'<td class="p-2 text-right font-bold">'+udDiffArrow_(ma-mb)+'</td>':'')
      +'</tr>';
  }).join('');

  function sum(arr){ return arr?arr.reduce(function(x,y){return x+y;},0):null; }
  var sWA=sum(weekA), sWB=sum(weekB), sMA=sum(monA), sMB=sum(monB);
  var totalRow='<tr class="bg-gray-50 font-bold"><td class="p-2 border-r border-t-2 border-gray-300">표시구간 합계</td>'
    +(hasWeekB?'<td class="p-2 border-r border-t-2 border-gray-300 text-right text-gray-500">'+sWB.toLocaleString('ko-KR')+'</td>'
      +'<td class="p-2 border-r border-t-2 border-gray-300 text-right">'+sWA.toLocaleString('ko-KR')+'</td>'
      +'<td class="p-2 border-r border-t-2 border-gray-300 text-right">'+udDiffArrow_(sWA-sWB)+'</td>'
      :'<td class="p-2 border-r border-t-2 border-gray-300 text-right">'+sWA.toLocaleString('ko-KR')+'</td>')
    +(hasMon?'<td class="p-2 border-r border-t-2 border-gray-300 text-right text-gray-500">'+sMB.toLocaleString('ko-KR')+'</td>'
      +'<td class="p-2 border-r border-t-2 border-gray-300 text-right">'+sMA.toLocaleString('ko-KR')+'</td>'
      +'<td class="p-2 border-t-2 border-gray-300 text-right">'+udDiffArrow_(sMA-sMB)+'</td>':'')
    +'</tr>';

  var thWeek=hasWeekB
    ? '<th class="p-2 font-bold text-gray-700 border-b border-r text-right">'+esc(opts.weekLabelB)+' 인원수</th>'
      +'<th class="p-2 font-bold text-gray-700 border-b border-r text-right">'+esc(opts.weekLabelA)+' 인원수</th>'
      +'<th class="p-2 font-bold text-gray-700 border-b border-r text-right">증감</th>'
    : '<th class="p-2 font-bold text-gray-700 border-b border-r text-right">'+esc(opts.weekLabelA)+' 인원수</th>';
  var thMon=hasMon?'<th class="p-2 font-bold text-gray-700 border-b border-r text-right bg-violet-50">'+esc(opts.monLabelB)+' 인원수</th>'
    +'<th class="p-2 font-bold text-gray-700 border-b border-r text-right bg-violet-50">'+esc(opts.monLabelA)+' 인원수</th>'
    +'<th class="p-2 font-bold text-gray-700 border-b text-right bg-violet-50">전월대비</th>':'';

  return'<div class="mt-5 pt-4 border-t border-dashed border-gray-200">'
    +'<div class="text-[11px] font-bold text-gray-700 mb-2">'+esc(opts.title)+(opts.note?' <span class="font-normal text-gray-400">'+esc(opts.note)+'</span>':'')+'</div>'
    +'<div class="overflow-x-auto border rounded-xl" style="max-height:420px;overflow-y:auto">'
    +'<table class="w-full text-left border-collapse text-xs">'
    +'<thead class="sticky top-0 bg-gray-100 z-10"><tr>'
    +'<th class="p-2 font-bold text-gray-700 border-b border-r">구간</th>'+thWeek+thMon
    +'</tr></thead><tbody class="divide-y">'+rows+totalRow+'</tbody></table></div></div>';
}

function udTip(ev,idx,chartId){
  var box=document.getElementById('ud-tip-'+chartId); if(!box) return;
  var s=window._udChartCache&&window._udChartCache[chartId]; if(!s) return;
  var b=s.buckets[idx]; if(b==null) return;
  var vA=s.valsA[idx]||0, vB=s.valsB?(s.valsB[idx]||0):null;
  var fmt=function(v){ return s.pctMode?v.toFixed(1)+'%':fmtNum(v); };
  var diffLine='';
  if(vB!=null){
    var diff=vA-vB;
    diffLine='<div style="display:flex;justify-content:space-between;gap:12px;opacity:.75"><span>비교</span><span style="font-weight:700">'+fmt(vB)+'</span></div>'
      +'<div style="border-top:1px solid rgba(255,255,255,.15);margin-top:4px;padding-top:4px;display:flex;justify-content:space-between;gap:12px"><span style="opacity:.7">증감</span><span style="font-weight:800;color:'+(diff<0?'#93c5fd':'#fca5a5')+'">'+(diff>=0?'+':'')+fmt(diff)+'</span></div>';
  }
  box.innerHTML='<div style="font-weight:800;margin-bottom:4px">'+esc(udBucketLabel_(b))+'</div>'
    +'<div style="display:flex;justify-content:space-between;gap:12px"><span>기준</span><span style="font-weight:700">'+fmt(vA)+'</span></div>'+diffLine;
  box.style.display='block';
  var wrap=box.parentNode, rect=wrap.getBoundingClientRect();
  var x=ev.clientX-rect.left+14, y=ev.clientY-rect.top+12;
  if(x+240>rect.width) x=ev.clientX-rect.left-240;
  box.style.left=Math.max(4,x)+'px';
  box.style.top=Math.max(4,y)+'px';
}
function udTipHide(chartId){ var b=document.getElementById('ud-tip-'+chartId); if(b) b.style.display='none'; }

function loadOnlineUsers(){

    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.ok||!d.online||!d.online.length){el.innerHTML='<p class="text-sm text-gray-400 py-2 text-center">현재 접속자가 없습니다.</p>';return;}
      var seen={};
      d.online=d.online.filter(function(u){var k=u.email||u.name;if(seen[k])return false;seen[k]=true;return true;});
      var html=d.online.map(function(u){

}
function loadAccessLogs(){
  apiGet('action=logs',function(d){
    var el=document.getElementById('access-logs');
    if(!el)return;
    if(!d.ok||!d.logs||!d.logs.length){el.innerHTML='<p class="text-sm text-gray-400 py-2 text-center">접속 기록이 없습니다.</p>';return;}
    var byDate={};
    d.logs.forEach(function(l){
      var day=l.time?(new Date(l.time).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'})):'알 수 없음';

    rows.forEach(function(r){

    });

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function runClocks(){
  setInterval(function(){
    var now=new Date();
    document.getElementById('clock-kr').textContent=now.toLocaleTimeString('ko-KR');
    document.getElementById('clock-tw').textContent=new Date(now.getTime()-3600000).toLocaleTimeString('ko-KR',{hour12:false,hour:'2-digit',minute:'2-digit'});
    document.getElementById('clock-th').textContent=new Date(now.getTime()-7200000).toLocaleTimeString('ko-KR',{hour12:false,hour:'2-digit',minute:'2-digit'});
    document.getElementById('clock-us').textContent=new Date(now.getTime()-57600000).toLocaleTimeString('ko-KR',{hour12:false,hour:'2-digit',minute:'2-digit'});
    document.getElementById('clock-utc').textContent=now.toLocaleTimeString('ko-KR',{timeZone:'UTC',hour12:false,hour:'2-digit',minute:'2-digit'});
  },1000);
}

function fmtNum(n){
  if(n>=100000000){var v=Math.round(n/10000000)/10;return(v%1===0?v.toFixed(0):v.toFixed(1))+'억';}
  if(n>=10000){var v=Math.round(n/1000)/10;return(v%1===0?v.toFixed(0):v.toFixed(1))+'만';}
  return Math.round(n).toLocaleString();
}
function parseChange(s){var str=String(s||'');var isDown=str.indexOf('▼')!==-1||str.indexOf('-')!==-1;var num=str.replace(/[▲▼\s]/g,'');return{text:(isDown?'▼':'▲')+num,dir:isDown?'down':'up'};}

function fetchKpiData(){
  if(!KPI_API_URL) return;
  var cacheKey='kpi_cache';
  var today=new Date().toISOString().slice(0,10);
  var hour=new Date().getHours();
  try{
    var cached=JSON.parse(localStorage.getItem(cacheKey)||'null');
    if(cached&&cached.date===today){
      var cachedAt=cached.hour*60+(cached.minute||0);
      var nowAt=hour*60+new Date().getMinutes();
      var past8=hour>=8;var cachedBefore8=cached.hour<8;
      if(!(past8&&cachedBefore8)&&(nowAt-cachedAt)<5){
        applyKpiData(cached.data);return;
      }
    }
  }catch(e){}
  // KPI API는 시트를 여러 개 갱신하느라 첫 응답이 20초 이상 걸릴 수 있다.
  // 타임아웃 없이 두면 "불러오는 중"에서 영원히 멈추므로 재시도 + 실패 안내를 붙인다.
  function attempt(tryNo){
    var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    var timer=setTimeout(function(){if(ctrl)ctrl.abort();},45000);
    fetch(KPI_API_URL+'?t='+Date.now(),ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(data){
        clearTimeout(timer);
        if(data&&data.success){
          try{localStorage.setItem(cacheKey,JSON.stringify({date:today,hour:hour,minute:new Date().getMinutes(),data:data}));}catch(e){}
          applyKpiData(data);
        }else{ kpiLoadFailed('서버가 데이터를 반환하지 못했습니다.'); }
      })
      .catch(function(e){
        clearTimeout(timer);
        console.error('KPI 로드 실패(시도 '+tryNo+'/3):',e);
        if(tryNo<3){ setTimeout(function(){attempt(tryNo+1);},1500*tryNo); }
        else{ kpiLoadFailed('응답이 없습니다. 네트워크 또는 서버 상태를 확인해주세요.'); }
      });
  }
  attempt(1);
}

// 로딩이 끝내 실패했을 때 "불러오는 중" 대신 이유와 재시도 버튼을 보여준다
function kpiLoadFailed(msg){
  var boxes=document.querySelectorAll('#analysis-body,#mt-list,#comp-cards,#content-area');
  Array.prototype.forEach.call(boxes,function(el){
    if(el&&/불러오는 중|로딩/.test(el.textContent||'')){
      el.innerHTML='<div class="text-center py-8"><i class="ti ti-alert-circle text-3xl text-amber-400"></i>'
        +'<p class="text-sm text-gray-500 mt-2">데이터를 불러오지 못했습니다.</p>'
        +'<p class="text-[11px] text-gray-400 mt-1">'+esc(msg)+'</p>'
        +'<button onclick="try{localStorage.removeItem(\'kpi_cache\')}catch(e){};location.reload()" '
        +'class="btn btn-sm btn-primary mt-3"><i class="ti ti-refresh"></i> 다시 시도</button></div>';
    }
  });
}

function applyKpiData(d){
  if(!d)return;
  var w=d.weekly||{};var c=w.change||{};
  if(w.dau){
    KPI_DATA=[
      {label:'일평균 DAU',value:fmtNum(w.dau),change:parseChange(c.dau).text,dir:parseChange(c.dau).dir,color:'#10b981',trend:[]},
      {label:'누적 NRU',value:fmtNum(w.nru),change:parseChange(c.nru).text,dir:parseChange(c.nru).dir,color:'#ef4444',trend:[],alert:parseChange(c.nru).dir==='up'&&parseFloat(String(c.nru||'').replace(/[^0-9.]/g,''))>50},
      {label:'주간 WAU',value:fmtNum(w.wau),change:parseChange(c.wau).text,dir:parseChange(c.wau).dir,color:'#3b82f6',trend:[]},
      {label:'일평균 PU',value:fmtNum(w.pu),change:parseChange(c.pu).text,dir:parseChange(c.pu).dir,color:'#14b8a6',trend:[]},
      {label:'주간 매출',value:fmtNum(w.revenue),change:parseChange(c.revenue).text,dir:parseChange(c.revenue).dir,color:'#8b5cf6',trend:[]}
    ];
  }
  var m=d.monthly||{};var mr=d.monthlyReport||{};var mc=mr.change||{};
  var mUpd=[
    {i:0,val:m.dau,change:m.dauChange},
    {i:1,val:m.revenue,change:m.revenueChange},
    {i:2,val:mr.mau,change:mc.mau},
    {i:3,val:mr.dau,change:mc.dau},
    {i:4,val:mr.pu,change:mc.pu,suffix:'명'},
    {i:5,val:mr.arppu,change:mc.arppu}
  ];
  mUpd.forEach(function(u){
    if(u.val){
      KPI_MONTHLY[u.i]=Object.assign({},KPI_MONTHLY[u.i],{value:fmtNum(u.val)+(u.suffix||''),change:parseChange(u.change).text,dir:parseChange(u.change).dir});
    }
  });
  // 전권역 데이터 캐시
  if(d.regions) window._regionsCache=d.regions;
  // 주차별 추이 캐시 (매출/DAU/PU/ARPPU 그래프용)
  if(d.weeklyTrend&&d.weeklyTrend.length) window._trendCache=d.weeklyTrend;
  if(d.weeklyTrendByRegion) window._trendByRegionCache=d.weeklyTrendByRegion;
  if(d.monthlyTrendByRegion) window._monthTrendCache=d.monthlyTrendByRegion;
  if(d.dailyGlobal) window._dailyGlobalCache=d.dailyGlobal;
  if(d.dailyGlobalPrev) window._dailyPrevCache=d.dailyGlobalPrev;
  if(d.dailyGlobalLastYear) window._dailyLastYearCache=d.dailyGlobalLastYear;
  if(d.dailyCompare) window._dailyCompareCache=d.dailyCompare;
  if(d.monthly) window._monthlyRawCache=d.monthly;
  if(d.dailyTargetPerDay) window._dailyTargetPerDay=d.dailyTargetPerDay;
  if(d.dailyTargetDays) window._dailyTargetDays=d.dailyTargetDays;
  if(d.dailyTargetCurve) window._dailyTargetCurve=d.dailyTargetCurve;
  window._glMajorUpdateDays=d.glMajorUpdateDays||[];

  // 마일스톤 동기화
  if(d.milestone&&d.milestone.date){
    var ms=d.milestone;
    window._milestoneTimeline=ms.timeline||[];
    // 오늘 기준 현재 마일스톤으로 최상위 필드를 덮어씀 (대시보드 위젯·뱃지도 최신 날짜 반영)
    var _ci=milestoneCurrentIdx(ms.timeline||[]);
    if(_ci!==-1){var _cur=ms.timeline[_ci];ms.date=_cur.date;ms.version=_cur.version;ms.kr=_cur.kr;ms.tw=_cur.tw;ms.jp=_cur.jp;ms.gl=_cur.gl;}
    function buildList(items,clr){
      if(!items||!items.length) return'<li class="text-gray-400">내역 없음</li>';
      return items.map(function(s){
        return'<li>'+esc(s).replace(/(신규|오픈|업데이트|전직|이벤트|5주년|점령전|알케미스트|스카디|새크리파이스)/g,'<b class="text-indigo-600">$1</b>')+'</li>';
      }).join('');
    }
    function card(title,clr,items){return'<div class="bg-white p-3 rounded-xl border shadow-sm"><div class="font-bold text-xs text-'+clr+'-600 mb-1.5 border-b border-gray-100 pb-1">'+title+'</div><ul class="text-[11px] text-gray-600 space-y-0.5 list-disc list-inside">'+buildList(items)+'</ul></div>';}
    window.dynamicMilestone={
      kr:'<div class="bg-amber-50 border border-amber-200 p-3 rounded-xl mb-3 flex items-center justify-between"><span class="text-xs font-bold text-amber-900">최신 패치</span><span class="text-[11px] bg-amber-200 text-amber-900 px-2 py-0.5 rounded font-bold">'+esc(ms.date)+'</span></div><ul class="space-y-1 text-xs text-gray-700 list-disc list-inside p-3 bg-white rounded-xl border shadow-sm">'+buildList(ms.kr)+'</ul>',
      tw:'<div class="bg-blue-50 border border-blue-200 p-3 rounded-xl mb-3 flex items-center justify-between"><span class="text-xs font-bold text-blue-900">최신 패치</span><span class="text-[11px] bg-blue-200 text-blue-900 px-2 py-0.5 rounded font-bold">'+esc(ms.date)+'</span></div><ul class="space-y-1 text-xs text-gray-700 list-disc list-inside p-3 bg-white rounded-xl border shadow-sm">'+buildList(ms.tw)+'</ul>',
      jp:'<div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl mb-3 flex items-center justify-between"><span class="text-xs font-bold text-emerald-900">최신 패치</span><span class="text-[11px] bg-emerald-200 text-emerald-900 px-2 py-0.5 rounded font-bold">'+esc(ms.date)+'</span></div><ul class="space-y-1 text-xs text-gray-700 list-disc list-inside p-3 bg-white rounded-xl border shadow-sm">'+buildList(ms.jp)+'</ul>',
      global:'<div class="bg-purple-50 border border-purple-200 p-3 rounded-xl mb-3 flex items-center justify-between"><span class="text-xs font-bold text-purple-900">글로벌 서비스</span><span class="text-[11px] bg-purple-200 text-purple-900 px-2 py-0.5 rounded font-bold">'+esc(ms.date)+'</span></div><ul class="space-y-1 text-xs text-gray-700 list-disc list-inside p-3 bg-white rounded-xl border shadow-sm">'+buildList(ms.gl)+'</ul>',
      cross:'<div class="mb-2.5 flex items-center justify-between border-b border-purple-200 pb-2"><span class="font-bold text-purple-900 text-xs"><i class="ti ti-world text-purple-600"></i> 전 권역 크로스체크</span><span class="text-[11px] bg-purple-100 text-purple-800 font-bold px-2 py-0.5 rounded">'+esc(ms.date)+'</span></div><div class="grid grid-cols-2 gap-2.5">'+card('🇰🇷 한국','red',ms.kr)+card('🇹🇼 대만','blue',ms.tw)+card('🇯🇵 일본','emerald',ms.jp)+card('🌐 글로벌','purple',ms.gl)+'</div>'
    };
    window._milestoneCurrentDate=ms.date;
  }

  // 연간매출 데이터
  if(d.annual){
    var an=d.annual;
    window._annualCache=an;
    // 월간 목표 뱃지 업데이트
    if(an.monthlyTarget&&an.monthlyTarget.plan){
      var mt=an.monthlyTarget;
      var achNum=parseFloat(String(mt.achieve||'').replace(/[^0-9.]/g,''))||0;
      var achColor=achNum>=100?'emerald':achNum>=90?'blue':achNum>=80?'amber':'red';
      // 전권역 당월 누적 매출 → 계획/추정 대비 실제 달성률을 함께 표기
      var tCum=(d.monthly&&d.monthly.revenue)||0;
      if(!tCum&&d.regions)['kr','tw','jp','gl'].forEach(function(k){
        var rr=d.regions[k]; if(rr&&rr.monthly&&rr.monthly.revenue)tCum+=rr.monthly.revenue;});
      function cumChip(label,tgtM){
        if(!tCum||!tgtM)return'';
        var p=tCum/(tgtM*1000000)*100;
        var cc=p>=100?'emerald':p>=90?'blue':p>=70?'amber':'red';
        return'<span class="text-[11px] font-bold text-'+cc+'-600 bg-'+cc+'-50 px-2 py-0.5 rounded-md">'+label+' '+p.toFixed(1)+'%</span>';
      }
      window._monthTargetHtml='<div class="flex items-center gap-2 flex-wrap"><span class="text-[11px] text-gray-400">계획 <b class="text-gray-700">'+fmtNum(mt.plan*1000000)+'</b></span><span class="text-[11px] text-gray-400">추정 <b class="text-gray-700">'+fmtNum(mt.estimate*1000000)+'</b></span><span class="text-[11px] font-bold text-'+achColor+'-600 bg-'+achColor+'-50 px-2 py-0.5 rounded-md">추정/계획 '+mt.achieve+'</span>'
        +(tCum?'<span class="text-[11px] text-gray-400">누적 <b class="text-gray-700">'+fmtNum(tCum)+'</b></span>':'')
        +cumChip('계획대비',mt.plan)+cumChip('추정대비',mt.estimate)+'</div>';
    }
  }

  // 마이비서 분석 데이터 (서버에서 요약된 섹션)
  if(d.analysis&&d.analysis.insight){
    var a=d.analysis,ins=a.insight;

    function goodBadHtml(items){
      if(!items||!items.length)return'<p class="text-[12px] text-gray-400">특이사항 없음</p>';
      return'<ul class="text-[12px] text-gray-700 leading-relaxed space-y-1.5">'+items.map(function(g){
        var good=g.sign==='good';
        return'<li class="flex items-start gap-1.5"><i class="ti '+(good?'ti-circle-check text-emerald-500':'ti-alert-circle text-amber-500')+' text-sm mt-0.5 flex-shrink-0"></i><span>'+esc(g.text)+'</span></li>';
      }).join('')+'</ul>';
    }
    var html='';
    if(ins.feature) html+=bucket('ti-chart-bar','blue','주간 현재 특징','<p class="text-[12px] text-gray-700 leading-relaxed">'+esc(ins.feature)+'</p>');
    html+=bucket('ti-list-check','teal','좋은 점 · 문제점',goodBadHtml(ins.goodBad));
    html+=bucket('ti-bulb','purple','원인 후보',listHtml(ins.cause,'특이사항 없음'));
    if(ins.monthly&&ins.monthly.length) html+=bucket('ti-calendar-dollar','indigo','월간 분석 (전달 · 이번 달)',listHtml(ins.monthly,'데이터 부족'));
    if(ins.schedule&&ins.schedule.length) html+=bucket('ti-calendar-stats','amber','글로벌 일정 점검',listHtml(ins.schedule,'예정된 일정 없음'));
    if(a.trend&&a.trend.length) html+=bucket('ti-speakerphone','rose','커뮤니티 동향',listHtml(a.trend,'특이사항 없음'));
    window._analysisCache='<div class="space-y-2.5">'+(a.period?'<div class="text-[10px] text-gray-400 font-semibold">📅 '+esc(a.period)+'</div>':'')+html+'</div>';
  } else if(d.analysis&&d.analysis.sections&&d.analysis.sections.length){
    var a=d.analysis;
    var iconMap={'트래픽':'ti-chart-line text-blue-500','매출':'ti-coin text-emerald-500','핵심':'ti-alert-circle text-amber-500','통찰':'ti-telescope text-purple-500'};
    var colorMap={'트래픽':'blue','매출':'emerald','핵심':'amber','통찰':'purple'};
    var html=a.sections.map(function(s){
      var icon=iconMap[s.key]||'ti-info-circle text-gray-500';
      var clr=colorMap[s.key]||'gray';
      var labels={'트래픽':'트래픽','매출':'매출','핵심':'핵심 포인트','통찰':'장기 통찰'};
      return'<div class="p-3.5 bg-'+clr+'-50/60 border border-'+clr+'-100 rounded-xl"><div class="flex items-center gap-1.5 mb-1.5"><i class="ti '+icon+' text-sm"></i><span class="font-bold text-xs text-'+clr+'-900">'+(labels[s.key]||s.key)+'</span></div><p class="text-[12px] text-gray-700 leading-relaxed">'+esc(s.summary)+'</p></div>';
    }).join('');
    window._analysisCache='<div class="space-y-2.5">'+(a.period?'<div class="text-[10px] text-gray-400 font-semibold">📅 '+esc(a.period)+'</div>':'')+html+'</div>';
  }
  if(d.competitor) window._competitorCache=d.competitor;
  if(currentPage==='dashboard') renderDashboard();
  if(currentPage==='milestone') renderMilestonePage();
  if(currentPage==='competitor') renderCompetitor();
  if(currentPage==='kpi') renderKpiPage();
  // renderDashboard가 DOM을 교체한 뒤에 뱃지 업데이트
  if(window._milestoneCurrentDate){
    var mdEl=document.getElementById('milestone-active-date');
    if(mdEl) mdEl.textContent='최신: '+window._milestoneCurrentDate;
  }
}

/* ═══════════════════════════════════════════
   경쟁사 모니터링
   ═══════════════════════════════════════════ */
function renderCompetitor(){
  var c=document.getElementById('content-area');
  var data=window._competitorCache;

  // 데이터 없으면 안내
  if(!data||!data.games||!data.games.length){
    c.innerHTML='<div class="card"><div class="card-header"><span class="card-title"><i class="ti ti-radar text-violet-500"></i> 경쟁사 모니터링</span></div>'
      +'<div class="text-center py-16 text-gray-400"><i class="ti ti-satellite text-5xl mb-3 block"></i>'
      +'<p class="font-semibold text-sm mb-1">아직 수집된 데이터가 없습니다</p>'
      +'<p class="text-xs">Apps Script에 <b>competitor-monitor.gs</b>를 설치하고<br>'
      +'<code class="bg-gray-100 px-1 rounded">collectCompetitorNews()</code>를 한 번 실행해 주세요.</p></div></div>';
    return;
  }

  var updatedLabel=data.updated?'<span class="text-[10px] text-gray-400 font-medium">최종 수집: '+esc(data.updated.slice(0,16).replace('T',' '))+'</span>':'';

  // 필터 탭
  var allGames=data.games.map(function(g){return g.name;});
  var filterHtml='<div class="flex flex-wrap gap-1.5 mb-4" id="comp-filter">'
    +'<button onclick="compFilter(\'\')" id="comp-f-all" class="comp-tab active text-[11px] font-bold px-3 py-1 rounded-full border bg-violet-600 text-white border-violet-600">전체</button>'
    +allGames.map(function(g){
      return'<button onclick="compFilter(\''+esc(g)+'\')" id="comp-f-'+esc(g)+'" class="comp-tab text-[11px] font-bold px-3 py-1 rounded-full border bg-white text-gray-600 border-gray-300 hover:border-violet-400 hover:text-violet-700 transition-colors">'+esc(g)+'</button>';
    }).join('')+'</div>';

  // 게임 카드들
  var GAME_COLOR={
    '이클립스':'violet','제우스':'blue','나이트크로우':'emerald','리니지W':'amber','검은사막M':'rose'
  };
  function colorOf(name){
    for(var k in GAME_COLOR){if(name.indexOf(k)!==-1)return GAME_COLOR[k];}
    return 'slate';
  }

  var cardsHtml=data.games.map(function(g){
    var clr=colorOf(g.name);
    var articles=g.articles||[];
    var summaryHtml=g.summary?'<div class="mb-3 px-3 py-2.5 bg-'+clr+'-50 border border-'+clr+'-200 rounded-xl text-[12px] text-'+clr+'-900 leading-relaxed"><i class="ti ti-sparkles text-'+clr+'-400 mr-1"></i>'+esc(g.summary)+'</div>':'';
    var artHtml=articles.length?articles.map(function(a,i){
      var dateStr=a.date?'<span class="text-[10px] text-gray-400 flex-shrink-0">'+esc(a.date.slice(0,10))+'</span>':'';
      var sourceStr=a.source?'<span class="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded flex-shrink-0">'+esc(a.source)+'</span>':'';
      var descStr=a.desc?'<p class="text-[11px] text-gray-500 mt-0.5 leading-relaxed line-clamp-2">'+esc(a.desc)+'</p>':'';
      var linkAttr=a.url?'href="'+esc(a.url)+'" target="_blank" rel="noopener"':'href="#" onclick="return false"';
      return'<li class="py-2.5 '+(i>0?'border-t border-gray-100':'')+'"><a '+linkAttr+' class="group block">'
        +'<div class="flex items-start justify-between gap-2">'
        +'<span class="text-[12px] font-semibold text-gray-800 group-hover:text-'+clr+'-700 leading-snug">'+esc(a.title)+'</span>'
        +'<div class="flex items-center gap-1 flex-shrink-0 mt-0.5">'+sourceStr+dateStr+'</div></div>'
        +descStr+'</a></li>';
    }).join('')
    :'<li class="py-4 text-center text-xs text-gray-400">수집된 기사가 없습니다</li>';

    return'<div class="card comp-game-card" data-game="'+esc(g.name)+'">'
      +'<div class="card-header"><span class="card-title text-sm"><i class="ti ti-device-gamepad-2 text-'+clr+'-500"></i> '+esc(g.name)+'</span>'
      +'<span class="text-[10px] font-bold bg-'+clr+'-50 text-'+clr+'-700 border border-'+clr+'-200 px-2 py-0.5 rounded-full">'+articles.length+'건</span></div>'
      +summaryHtml
      +'<ul>'+artHtml+'</ul></div>';
  }).join('');

  // 등록 경쟁작에 안 걸리는 시장 전반 신호를 맨 위에 한두 줄로
  var mk=data.market,marketHtml='';
  if(mk&&mk.text){
    marketHtml='<div class="mb-4 rounded-xl border border-violet-200 bg-violet-50/70 px-4 py-3">'
      +'<div class="flex items-start gap-2">'
      +'<i class="ti ti-bulb text-violet-500 text-base mt-0.5 shrink-0"></i>'
      +'<div class="min-w-0"><div class="text-[11px] font-bold text-violet-700 mb-0.5">한국 MMORPG 시장 특이사항</div>'
      +'<div class="text-[13px] text-gray-700 leading-relaxed">'+esc(mk.text)+'</div>'
      +(mk.source?'<div class="text-[10px] text-gray-400 mt-1 truncate" title="'+esc(mk.source)+'">근거: '+esc(mk.source)+'</div>':'')
      +'</div></div></div>';
  }

  c.innerHTML='<div class="card-header mb-3" style="padding:0"><span class="card-title text-sm"><i class="ti ti-radar text-violet-500"></i> 경쟁사 모니터링</span>'
    +'<div class="flex items-center gap-2">'+updatedLabel
    +'<button id="comp-clear-btn" class="btn btn-sm btn-secondary" onclick="clearCompetitorRecords()"><i class="ti ti-trash"></i> 기록 정리</button>'
    +'<button id="comp-collect-btn" class="btn btn-sm btn-primary" onclick="collectCompetitorNow()"><i class="ti ti-refresh"></i> 지금 수집</button></div></div>'
    +filterHtml
    +marketHtml
    +'<div id="comp-cards" class="grid grid-cols-1 lg:grid-cols-2 gap-4">'+cardsHtml+'</div>';
}

// 뉴스를 지금 새로 수집한다 (수집기는 Apps Script에서 실행 → 1~2분 소요)
function collectCompetitorNow(){
  var btn=document.getElementById('comp-collect-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2 animate-spin"></i> 수집 중... (1~2분)';}
  fetch(KPI_API_URL+'?action=competitor_collect&t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d.ok){
        if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-refresh"></i> 지금 수집';}
        alert('수집 실패: '+((d&&(d.error||d.hint))||'수집기가 이 프로젝트에 없습니다.'));
        return;
      }
      try{localStorage.removeItem('kpi_cache');}catch(e){}
      if(btn)btn.innerHTML='<i class="ti ti-check"></i> 완료 — 새로고침 중';
      location.reload();
    })
    .catch(function(e){
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-refresh"></i> 지금 수집';}
      alert('수집 실패: '+e.message);
    });
}

// 쌓인 경쟁사 기록 삭제 — 기간을 고르게 하고, 되돌릴 수 없으므로 한 번 더 확인받는다
function clearCompetitorRecords(){
  var ans=prompt('며칠 지난 기록을 지울까요?\n\n숫자 입력 = 그보다 오래된 기록만 삭제 (예: 7 → 7일 전 것부터)\n0 입력 = 전체 삭제','7');
  if(ans===null)return;
  var days=parseInt(ans,10);
  if(isNaN(days)||days<0){alert('숫자를 입력해 주세요.');return;}
  var what=days===0?'경쟁사 기록 전체':(days+'일보다 오래된 기록');
  if(!confirm(what+'를 삭제합니다.\n되돌릴 수 없어요. 진행할까요?'))return;

  var btn=document.getElementById('comp-clear-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2 animate-spin"></i> 정리 중...';}
  fetch(KPI_API_URL+'?action=competitor_clear&days='+days+'&t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d.ok)throw new Error((d&&d.error)||'알 수 없는 오류');
      try{localStorage.removeItem('kpi_cache');}catch(e){}
      alert('총 '+d.total+'건을 삭제했어요.');
      location.reload();
    })
    .catch(function(e){
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-trash"></i> 기록 정리';}
      alert('삭제 실패: '+e.message);
    });
}

function compFilter(name){
  // 탭 active 상태
  document.querySelectorAll('.comp-tab').forEach(function(btn){
    var isAll=(name===''&&btn.id==='comp-f-all');
    var isMatch=(name!==''&&btn.id==='comp-f-'+name);
    if(isAll||isMatch){btn.className=btn.className.replace(/bg-white text-gray-600 border-gray-300/,'').trim()+' bg-violet-600 text-white border-violet-600';}
    else{btn.className=btn.className.replace(/bg-violet-600 text-white border-violet-600/,'').trim()+' bg-white text-gray-600 border-gray-300';}
  });
  // 카드 표시/숨김
  document.querySelectorAll('.comp-game-card').forEach(function(el){
    el.style.display=(name===''||el.dataset.game===name)?'':'none';
  });
}
